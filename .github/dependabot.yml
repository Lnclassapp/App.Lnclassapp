# Dependency updates follow the same road as any change: a pull request into Develop, then the promotions to
# Staging and main (ADR-0069). One grouped pull request per ecosystem and per week: each pull request costs a CI run.
version: 2
updates:
- package-ecosystem: bundler
  directory: "/"
  target-branch: Develop
  schedule:
    interval: weekly
  open-pull-requests-limit: 2
  groups:
    gems:
      patterns: [ "*" ]
- package-ecosystem: github-actions
  directory: "/"
  target-branch: Develop
  schedule:
    interval: weekly
  open-pull-requests-limit: 2
  groups:
    actions:
      patterns: [ "*" ]
