# GitHub runs bin/ci, exactly like a developer does locally: the steps live in config/ci.rb only
# (feuille-de-route §2, garde-fou n° 4). The one status a pull request waits for is « ci » (ADR-0069).
#
# The GitHub minutes of a private repository are counted per job, rounded up to the minute. Hence (ADR-0069):
#   - pull requests only: a push on Develop, Staging or main merges a tree its pull request already tested;
#   - a draft pull request waits: the run starts when it is marked ready for review;
#   - a tree that already got a green « ci » is not replayed (a promotion, a re-run): about two minutes;
#   - a pull request that touches documentation alone is green without playing the checks;
#   - otherwise the whole bin/ci, in jobs side by side, none longer than five minutes (ADR-0107, the owner's ceiling):
#     « unit » plays every group but the system tests, in parts (the unit suite in three parts, the other checks, the
#     import performance in two parts on a full run); « coverage » merges the coverage of the three unit parts and checks
#     the 100 % threshold on the whole suite (ADR-0024); « system » plays the system tests in six parts of similar
#     duration (script/ci/test_timings.yml).
#   - pull requests into Staging and main only (ADR-0107): a pull request into Develop proves its change locally,
#     with bin/ci-quiet; the whole suite runs once per train, at the promotion.
# « plan » decides (a few seconds) and « ci » gives the verdict and publishes the proof of the tested tree.
# test/guards/ci_plan_test.rb holds these rules.
name: CI

on:
  pull_request:
    types: [ opened, synchronize, reopened, ready_for_review ]

# A new push to a pull request cancels the run it makes obsolete.
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  RUBOCOP_CACHE_ROOT: tmp/rubocop

jobs:
  # What this run plays: the draw, the proof of the tree, the documentation-only rule. No toolchain, a few seconds.
  # ADR-0069, amendment of 2026-10-04: the CI is switched off until the repository variable CI_ENABLED is « true »
  # (Settings → Secrets and variables → Actions → Variables). Off, « plan » is skipped and so is everything after,
  # as for a draft: no runner, no failure. The proof is then bin/ci run locally.
  plan:
    name: plan
    # ADR-0107 : once per train, at the promotion into Staging (and its release into main, proven by the same tree).
    if: ${{ !github.event.pull_request.draft && vars.CI_ENABLED == 'true' && (github.base_ref == 'Staging' || github.base_ref == 'main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Job permissions replace the workflow's: the private repository needs contents too (HTTP 403 without it).
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      full: ${{ steps.draw.outputs.full }}
      unit: ${{ steps.draw.outputs.unit }}
      tested: ${{ steps.proof.outputs.tested }}
      code: ${{ steps.changes.outputs.code }}
      lessons: ${{ steps.changes.outputs.lessons }}
      tree: ${{ steps.tree.outputs.sha }}

    steps:
      - uses: actions/checkout@v7

      # ADR-0069 §8 : a promotion into Staging always replays the whole suite, and GitHub draws one pull request into
      # Develop in five that replays it whatever its proof says. The draw is fixed per pull request (a new push does not
      # draw again) and nobody can foresee it: it hashes the repository secret CI_DRAW_SALT with the pull request number.
      # Without the secret (not set yet, or a Dependabot pull request), every pull request into Develop replays it.
      - id: draw
        env:
          BASE: ${{ github.base_ref }}
          PR: ${{ github.event.pull_request.number }}
          SALT: ${{ secrets.CI_DRAW_SALT }}
        run: |
          echo "CI_DRAW_SALT : $([ -n "$SALT" ] && echo présent || echo absent)"
          full=false
          if [ "$BASE" = "Staging" ] || { [ "$BASE" = "Develop" ] && [ -z "$SALT" ]; }; then
            full=true
          elif [ "$BASE" = "Develop" ]; then
            hash=$(printf '%s:%s' "$SALT" "$PR" | sha256sum | cut -c1-8)
            [ $(( 16#$hash % 5 )) -eq 0 ] && full=true
          fi
          echo "full=$full" | tee -a "$GITHUB_OUTPUT"
          # ADR-0069 §9, ADR-0107 : the parts of the « unit » job, side by side, under five minutes each; « system »
          # plays the system tests. The unit suite plays in three parts (chantiers ci-unit-en-parts, ci-train-rapide): « coverage » merges
          # their coverage and checks the threshold on the whole suite. The import performance tests (ADR-0039) run on
          # a full run only, in two parts: the promotion into Staging plays them.
          [ "$full" = true ] && unit='["unit:1/3","unit:2/3","unit:3/3","lint,security,seeds,assets","perf:1/2","perf:2/2"]' || unit='["unit:1/3","unit:2/3","unit:3/3","lint,security,seeds,assets"]'
          echo "unit=$unit" | tee -a "$GITHUB_OUTPUT"

      # Has this exact tree already got a green « ci »? Any doubt (unreadable commit, API error) answers no.
      - id: proof
        if: steps.draw.outputs.full != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          # ADR-0069 §8 : the proof of a cloud session counts for a pull request into Develop only.
          LOCAL_PROOF: ${{ github.base_ref == 'Develop' }}
        run: script/ci/tested_tree

      # Documentation alone: nothing to check. Any doubt (an unreadable diff) runs everything.
      # A renamed file counts under both names: moving code into docs/ still removes code.
      - id: changes
        if: steps.proof.outputs.tested != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          code=true
          lessons=true
          if files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[] | .filename, (.previous_filename // empty)') && [ -n "$files" ]; then
            echo "$files"
            echo "$files" | grep -qvE '^docs/|\.md$' || code=false
            # standard-de-test, Lot D : des leçons v3 qui bougent se rendent même si elles sont des documents (docs/contenus).
            echo "$files" | grep -qE '^docs/contenus/lecons-traitees/.*\.json$' || lessons=false
          fi
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"
          echo "lessons=$lessons" | tee -a "$GITHUB_OUTPUT"

      # The tree the jobs below test, read here: the proof is the tree, not the commit (ADR-0069 §4.3).
      - id: tree
        run: echo "sha=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"

  # Every group but the system tests, in parts: the unit suite in three parts, each keeping its coverage for « coverage »;
  # lint, security, seeds and assets; the import performance tests on a full run, in two parts.
  unit:
    name: unit ${{ matrix.groups }}
    needs: plan
    if: needs.plan.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        groups: ${{ fromJSON(needs.plan.outputs.unit) }}
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      # ADR-0069 §9 : the PostgreSQL of the runner image, already installed, instead of a service container (23 s to
      # pull and start). Same credentials as config/database.yml, loopback only (the image binds 127.0.0.1).
      - name: PostgreSQL of the image
        run: |
          sudo systemctl start postgresql
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "CREATE ROLE \"dev-rails\" LOGIN SUPERUSER PASSWORD 'dev-rails'"
          pg_isready -h 127.0.0.1

      - uses: ./.github/actions/setup

      - name: Rubocop cache
        uses: actions/cache@v6
        with:
          path: tmp/rubocop
          key: rubocop-${{ hashFiles('.rubocop.yml', 'Gemfile.lock') }}-${{ github.sha }}
          restore-keys: rubocop-${{ hashFiles('.rubocop.yml', 'Gemfile.lock') }}-

      - name: Run bin/ci
        env:
          CI_GROUP: ${{ matrix.groups }}
        run: bin/ci

      # The raw coverage of a unit part (.resultset.json, a hidden file), merged by « coverage ». An artifact name
      # cannot hold « : » or « / »: the index of the matrix job makes it unique.
      - name: Keep the coverage of this unit part
        uses: actions/upload-artifact@v7
        if: startsWith(matrix.groups, 'unit:')
        with:
          name: coverage-unit-${{ strategy.job-index }}
          path: ${{ github.workspace }}/coverage/.resultset.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  # ADR-0024 : 100 % lines and branches, measured on the whole unit suite. The three parts of « unit » keep their raw
  # coverage; this job merges them (script/ci/coverage_collate) and checks the threshold. A missing part fails here.
  coverage:
    name: coverage
    needs: [ plan, unit ]
    if: ${{ !cancelled() && needs.plan.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Download the coverage of the unit parts
        uses: actions/download-artifact@v7
        with:
          pattern: coverage-unit-*
          path: ${{ runner.temp }}/coverage-parts

      - name: Merge the parts and check 100 % lines and branches
        run: script/ci/coverage_collate 3 "$RUNNER_TEMP/coverage-parts"

      - name: Keep the coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: ${{ github.workspace }}/coverage
          if-no-files-found: ignore

  # The system tests alone, the longest group (7 of the 9 minutes bin/ci takes on a runner), in six parts of
  # similar recorded duration: about 1 minute 15 of tests each, under five minutes with the setup. A red part does
  # not cancel the others.
  system:
    name: system ${{ matrix.part }}/6
    needs: plan
    if: needs.plan.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        part: [ 1, 2, 3, 4, 5, 6 ]
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      # ADR-0069 §9 : the PostgreSQL of the runner image (see « unit »).
      - name: PostgreSQL of the image
        run: |
          sudo systemctl start postgresql
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "CREATE ROLE \"dev-rails\" LOGIN SUPERUSER PASSWORD 'dev-rails'"
          pg_isready -h 127.0.0.1

      - uses: ./.github/actions/setup

      # Google Chrome and its driver are preinstalled on ubuntu-latest: the
      # system tests run in a real headless browser, never under rack_test.
      - name: Run bin/ci
        env:
          CI_GROUP: system:${{ matrix.part }}/6
        run: bin/ci

      - name: Keep screenshots from failed system tests
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: screenshots-${{ matrix.part }}
          path: ${{ github.workspace }}/tmp/screenshots
          if-no-files-found: ignore

  # standard-de-test, Lot D (ADR standard-de-test §4 point 4) : chaque leçon v3 est importée dans la base de test, publiée et lue
  # par un élève à 390 px puis sur ordinateur (test/system/catalog/lesson_rendering_test.rb). Sept parts (chantier ci-train-rapide) :
  # ≈ 80 s fixes par part (installation, démarrage de Chrome) et ≈ 2,1 s par leçon, soit ≈ 70 fichiers et moins de 3 minutes par
  # part. Sept et pas plus : un run complet garde ses tâches de test sous la limite de 20 tâches simultanées du compte
  # (garde ci_plan_test), sans file d'attente. Rien n'est publié hors de la base de test. Une part rouge n'annule pas les autres.
  lecons:
    name: lecons ${{ matrix.part }}/7
    needs: plan
    if: needs.plan.outputs.code == 'true' || needs.plan.outputs.lessons == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        part: [ 1, 2, 3, 4, 5, 6, 7 ]
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: PostgreSQL of the image
        run: |
          sudo systemctl start postgresql
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "CREATE ROLE \"dev-rails\" LOGIN SUPERUSER PASSWORD 'dev-rails'"
          pg_isready -h 127.0.0.1

      - uses: ./.github/actions/setup

      - name: Render the lessons of this part
        env:
          LECONS: tout
          LECONS_PART: ${{ matrix.part }}/7
          COVERAGE: "0"
        run: |
          bin/setup --skip-server
          bin/check-chrome
          bin/rails test:prepare
          PARALLEL_WORKERS=1 bin/rails test test/system/catalog/lesson_rendering_test.rb -v

      - name: Keep screenshots from failed lessons
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: screenshots-lecons-${{ matrix.part }}
          path: ${{ github.workspace }}/tmp/screenshots
          if-no-files-found: ignore

  # The verdict the branches wait for. Green when nothing had to be replayed (a proven tree, documentation alone),
  # or when every test job is green (« unit » and « system » stand for all their parts, « coverage » for the threshold): only then does the run prove its tree, ci-tree-<tree>, kept 30 days, so that a
  # later promotion of the same files is green in about two minutes. A draft (« plan » skipped) gets no verdict.
  ci:
    name: ci
    needs: [ plan, unit, coverage, system, lecons ]
    if: ${{ !cancelled() && needs.plan.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - id: verdict
        env:
          PLAN: ${{ needs.plan.result }}
          CODE: ${{ needs.plan.outputs.code }}
          UNIT: ${{ needs.unit.result }}
          COVERAGE: ${{ needs.coverage.result }}
          SYSTEM: ${{ needs.system.result }}
          LESSONS: ${{ needs.plan.outputs.lessons }}
          LECONS: ${{ needs.lecons.result }}
        run: |
          echo "plan=$PLAN code=$CODE unit=$UNIT coverage=$COVERAGE system=$SYSTEM lessons=$LESSONS lecons=$LECONS"
          [ "$PLAN" = success ] || { echo "::error::« plan » n'a pas abouti"; exit 1; }
          if [ "$CODE" != true ]; then
            # Des documents seulement : sauf des leçons v3, qui se rendent (standard-de-test, Lot D).
            if [ "$LESSONS" = true ] && [ "$LECONS" != success ]; then
              echo "::error::lecons : $LECONS"
              exit 1
            fi
            echo "Rien à rejouer : arbre déjà prouvé, ou documents seulement."
            exit 0
          fi
          if [ "$UNIT" = success ] && [ "$COVERAGE" = success ] && [ "$SYSTEM" = success ] && [ "$LECONS" = success ]; then
            : > "$RUNNER_TEMP/ci-tree"
            echo "proof=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::unit : $UNIT, coverage : $COVERAGE, system : $SYSTEM, lecons : $LECONS"
            exit 1
          fi

      - name: Publish the proof of the tested tree
        if: steps.verdict.outputs.proof == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ci-tree-${{ needs.plan.outputs.tree }}
          path: ${{ runner.temp }}/ci-tree
          retention-days: 30
          if-no-files-found: error
