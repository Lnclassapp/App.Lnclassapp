# One job, one script: GitHub runs bin/ci, exactly like a developer does locally.
# The steps live in config/ci.rb only — two lists of steps end up diverging
# (feuille-de-route §2, pièges connus).
name: CI

on:
  pull_request:
  push:
    branches: [ Develop, Staging, main ]

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:17
        # Same credentials as config/database.yml, so no DATABASE_URL is needed.
        env:
          POSTGRES_USER: dev-rails
          POSTGRES_PASSWORD: dev-rails
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=3

    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop

    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libpq-dev

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Enable Yarn (corepack)
        run: corepack enable

      # Google Chrome and its driver are preinstalled on ubuntu-latest: the
      # system tests run in a real headless browser, never under rack_test.
      - name: Run bin/ci
        run: bin/ci

      - name: Keep screenshots from failed system tests
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: screenshots
          path: ${{ github.workspace }}/tmp/screenshots
          if-no-files-found: ignore

      - name: Keep the coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: ${{ github.workspace }}/coverage
          if-no-files-found: ignore
