<!doctype html>
<!-- 🌐 UI · public/404.html — page d'erreur statique, servie hors de Rails (sans CSP, sans JavaScript, sans ressource externe) -->
<!-- Rôle : dire l'erreur en français, aux couleurs du design system, et ramener à l'accueil (recette-v1-defauts, D2) -->
<!-- ADR  : 0049 · UDR : 0005 -->
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Page introuvable · Lnclass</title>
    <style>
      :root {
        --paper: #faf8f4; --ink: #262626; --mute: #5e5a54; --line: #e6e1d8; --white: #ffffff;
        --brand: #00a0ff; --brand-soft: #e5f5ff; --brand-strong: #0070b3;
        --error: #c8322b; --error-soft: #fdecea;
        --font-sans: "DM Sans", ui-sans-serif, system-ui, sans-serif;
        --font-display: "Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif;
      }
      *, *::before, *::after { box-sizing: border-box; }
      * { margin: 0; }
      html { -webkit-text-size-adjust: 100%; }
      body {
        min-height: 100dvh; display: grid; place-items: center; padding: 2.5rem 1.25rem;
        background: var(--paper); color: var(--ink); font-family: var(--font-sans); line-height: 1.5;
      }
      main { width: 100%; max-width: 24rem; }
      .brand { margin-bottom: 2rem; text-align: center; font-family: var(--font-display); font-size: 1.5rem; font-weight: 800; color: var(--brand-strong); }
      .card {
        padding: 2rem; border: 1px solid var(--line); border-radius: 1.5rem; background: var(--white);
        box-shadow: 0 2px 8px rgb(38 38 38 / 0.04); text-align: center;
      }
      .code {
        display: inline-block; padding: 0.25rem 0.75rem; border-radius: 999px; background: var(--error-soft); color: var(--error);
        font-size: 0.875rem; font-weight: 600;
      }
      h1 { margin-top: 1rem; font-family: var(--font-display); font-size: 1.25rem; font-weight: 800; overflow-wrap: anywhere; }
      p { margin-top: 0.5rem; font-size: 0.875rem; color: var(--mute); overflow-wrap: anywhere; }
      a.button {
        display: flex; align-items: center; justify-content: center; min-height: 3rem; margin-top: 1.5rem; padding: 0.75rem 1.25rem;
        border-radius: 999px; background: var(--brand); color: var(--ink); font-weight: 600; text-decoration: none;
      }
      a.button:hover { background: rgb(0 160 255 / 0.85); }
      a.button:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <p class="brand">Lnclass</p>
      <div class="card">
        <span class="code">Erreur 404</span>
        <h1>Page introuvable</h1>
        <p>Cette page n'existe pas ou n'est plus disponible. Vérifiez l'adresse, ou revenez à l'accueil.</p>
        <a class="button" href="/">Revenir à l'accueil</a>
      </div>
    </main>
  </body>
</html>
