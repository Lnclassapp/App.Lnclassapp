@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1218; --ink: #eef1f5; --mute: #9aa3b0; --frame: #05070b;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1218; --ink: #eef1f5; --mute: #9aa3b0; --frame: #05070b;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--frame); color: var(--ink);
  font-family: var(--font-sans); font-size: 16px; -webkit-font-smoothing: antialiased;
}
a { color: inherit; }
:focus-visible { outline: 3px solid var(--brand); outline-offset: 3px; border-radius: 12px; }

.screen {
  position: relative; overflow: hidden;
  max-width: 430px; margin-inline: auto;
  min-height: 100%; min-height: 100dvh;
  display: flex; flex-direction: column;
  background: var(--bg);
}

/* ——— Visuel ——— */
.media { position: relative; flex: 1; min-height: 300px; overflow: hidden; background: #2a1d14; }
/* Photo nette, sans flou : cadrée pour garder les deux visages (garçon à gauche, fille à droite) */
.photo { position: absolute; inset: 0; background: var(--photo) 51% 100% / cover no-repeat; }
/* Ombre douce en haut : le haut reconstitué s'efface, l'œil descend vers les élèves, le badge ressort */
.media::after {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(to bottom, rgb(22 15 9 / .55) 0%, rgb(22 15 9 / .22) 26%, rgb(22 15 9 / 0) 46%);
}

/* Badge étoilé en haut à droite, au bleu Lnclass. Texte d'exemple : à remplacer par l'offre réelle. */
.badge {
  position: absolute; z-index: 5; right: 4px; top: 12px;
  width: 160px; height: 160px; transform: rotate(8deg);
  display: grid; place-items: center; text-align: center;
}
.badge svg { position: absolute; inset: 0; width: 100%; height: 100%; filter: drop-shadow(0 8px 16px rgb(0 0 0 / .35)); }
.badge-text {
  position: relative; display: grid; gap: 0;
  color: var(--on-brand); font-weight: 700; font-size: 13.5px; line-height: 1.1; white-space: nowrap; letter-spacing: -.005em;
}
.badge-text b {
  font-family: var(--font-display); font-weight: 800; font-size: 34px; line-height: 1;
  color: var(--brand-dark); letter-spacing: -.01em; margin: 1px 0 2px;
}

/* ——— Feuille du bas ——— */
.sheet {
  position: relative; z-index: 3; margin-top: -28px;
  background: var(--bg); border-radius: 28px 28px 0 0;
  padding: 24px 16px calc(10px + env(safe-area-inset-bottom, 0px));
  flex: none; display: grid; justify-items: center; text-align: center;
}
/* Slogan : deux lignes, la chute « chap chap » au bleu Lnclass, soulignée d'un trait or */
.slogan {
  margin: 0 0 18px; display: grid; justify-items: center; gap: 2px;
  font-family: var(--font-display); font-weight: 800; letter-spacing: -.02em; line-height: 1.05;
}
.slogan .l1 { font-size: 26px; }
.slogan .l2 { position: relative; font-size: 40px; color: var(--brand); padding-bottom: 8px; }
.slogan .l2 svg { position: absolute; left: 2%; bottom: -2px; width: 96%; height: 12px; }
.actions { width: 100%; display: grid; justify-items: center; }
.roles { width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
/* Boutons : plein bleu (principal) et contour bleu (secondaire), libellés en gras 17 px */
.role {
  min-height: 54px; border-radius: 999px; padding: 0 12px;
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 17px; text-decoration: none; white-space: nowrap;
  border: 2px solid var(--brand);
  transition: filter .15s, transform .1s, background .15s;
}
.role:active { transform: scale(.98); }
.role.primary { background: var(--brand); color: var(--on-brand); }
.role.primary:hover { filter: brightness(.95); }
.role.primary:active { filter: brightness(.9); }
.role.secondary { background: var(--bg); color: var(--brand); }
.role.secondary:hover { background: rgb(0 160 255 / .08); }
/* Lien établissement collé aux boutons */
.school-link {
  margin-top: 4px;
  display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 8px;
  color: var(--brand); font-weight: 700; font-size: 16px; text-decoration: none;
}
.school-link svg { width: 18px; height: 18px; transition: transform .15s; }
.school-link:hover svg { transform: translateX(3px); }
/* Invitation aux applications mobiles : petit texte tout en bas.
   Petits libellés en encre (lisibles au soleil) ; le bleu reste sur les icônes. */
.apps { margin: 6px 0 0; display: grid; gap: 2px; justify-items: center; font-size: 13px; line-height: 1.4; color: var(--mute); }
.apps p { margin: 0; }
.app-links { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 0 8px; }
.app-links a {
  display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 2px;
  color: var(--ink); font-weight: 700; text-decoration: none; white-space: nowrap;
}
.app-links .sep { color: var(--mute); }
.app-tile {
  width: 20px; height: 20px; border-radius: 6px; flex: none;
  background: var(--logo) center / 80% no-repeat, var(--brand);
}

/* Aperçu sur ordinateur : cadre de téléphone */
.statusbar { display: none; }
@media (min-width: 520px) {
  body { padding-block: 32px; height: auto; }
  .screen { height: 844px; min-height: 0; border-radius: 36px; box-shadow: 0 30px 80px rgb(0 0 0 / .25); }
  .statusbar {
    display: flex; justify-content: space-between; align-items: center;
    position: absolute; top: 0; left: 0; right: 0; z-index: 4;
    padding: 14px 28px 0; font-size: 15px; font-weight: 700; color: #1f2128; font-variant-numeric: tabular-nums;
  }
  .statusbar .dots { display: flex; gap: 6px; align-items: center; }
  .statusbar .bat { width: 26px; height: 13px; border-radius: 4px; border: 2px solid currentColor; position: relative; }
  .statusbar .bat::after { content: ""; position: absolute; inset: 1px; right: 30%; background: currentColor; border-radius: 1px; }
  .statusbar { color: #ffffff; text-shadow: 0 1px 3px rgb(0 0 0 / .45); }
  .badge { top: 44px; }
}
@media (max-width: 359px) {
  .role { font-size: 16px; }
  .slogan .l1 { font-size: 23px; }
  .slogan .l2 { font-size: 36px; }

}
@media (max-width: 380px) {
  .badge { width: 146px; height: 146px; }
  .badge-text { font-size: 12.5px; }
  .badge-text b { font-size: 31px; }
}
@media (max-width: 340px) {
