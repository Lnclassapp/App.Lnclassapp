# Rejoindre un établissement par son code depuis l'écran d'attente — GD-23 à GD-28, ADR-0071 §4.3, UDR-0056 §3.5
fr:
  activemodel:
    attributes:
      dtos/school/school_join_input:
        school_code: "Code d'établissement"
    errors:
      models:
        dtos/school/school_join_input:
          attributes:
            school_code:
              blank: "Saisissez le code de votre établissement."
              invalid: "Code d'établissement invalide. Il compte 6 caractères, par exemple K7M-4QZ."
              classroom_code: "Ce code est un code de classe. Demandez le code d'établissement à votre établissement."
              inclusion: "Code d'établissement invalide. Vérifiez-le auprès de votre établissement."
  identity:
    pending_school_joins:
      create:
        welcome: "Bienvenue à %{school}. Sélectionnez vos classes."
