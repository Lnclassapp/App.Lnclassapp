# Rejoindre un établissement depuis l'écran d'attente : DRENA puis établissement — IE-18, ADR-0071 §4.3, ADR-0083 §4.3, UDR-0079 §3.9
fr:
  activemodel:
    attributes:
      dtos/school/school_join_input:
        drena_public_id: "DRENA"
        school_public_id: "Établissement"
    errors:
      models:
        dtos/school/school_join_input:
          attributes:
            # La DRENA est déduite de l'établissement (ADR-XXXX-recherche-etablissement §4.4) : elle ne manque que s'il est introuvable.
            drena_public_id:
              blank: "Cet établissement ne peut pas être rejoint."
            school_public_id:
              blank: "Choisissez votre établissement."
              inclusion: "Cet établissement ne peut pas être rejoint."
  identity:
    pending_school_joins:
      create:
        welcome: "Bienvenue à %{school}."
