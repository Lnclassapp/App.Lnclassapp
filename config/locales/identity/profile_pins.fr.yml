# Changer son PIN depuis « Mon profil » (chantier profil-utilisateur, Lot C) — PR-06, PR-07, ADR-0055, UDR-0041
# UDR-0041, amendement du 2026-10-06 : l'élève est tutoyé (charte §1) ; clés « _student », lues par tone_t. Les erreurs,
# communes à tous les rôles, se disent sans pronom.
fr:
  activemodel:
    attributes:
      dtos/identity/pin_change_input:
        current_pin: "Code secret actuel"
        pin: "Nouveau code secret"
        pin_confirmation: "Confirmation du nouveau code secret"
    errors:
      models:
        dtos/identity/pin_change_input:
          attributes:
            current_pin:
              blank: "Le code secret actuel est obligatoire."
              invalid: "Le code secret compte 4 chiffres."
              incorrect: "Code secret incorrect."
            pin:
              blank: "Le nouveau code secret, à 4 chiffres, est obligatoire."
              invalid: "Le code secret compte 4 chiffres."
              unchanged: "C'est déjà le code secret de ce compte."
            pin_confirmation:
              confirmation: "Les deux codes secrets ne sont pas identiques."
  identity:
    profile_pins:
      edit:
        title: "Changer mon code secret"
        intro: "Saisissez votre code secret actuel, puis deux fois le nouveau. Vos autres appareils seront déconnectés."
        intro_student: "Saisis ton code secret actuel, puis deux fois le nouveau. Tes autres appareils seront déconnectés."
        pin_hint: "4 chiffres, que vous seul connaissez."
        pin_hint_student: "4 chiffres, que toi seul connais."
        cancel: "Annuler"
        submit: "Changer mon code secret"
      update:
        changed: "Votre code secret est changé."
        changed_student: "Ton code secret est changé."
