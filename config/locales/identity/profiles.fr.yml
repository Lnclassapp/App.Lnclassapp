# Page « Mon profil » et modale du nom (plan profil-utilisateur, Lot A) — PR-01 à PR-03, ADR-0055, UDR-0041 ; direction : UDR-0052
# UDR-0041, amendement du 2026-10-06 : l'élève est tutoyé (charte §1) ; clés « _student », lues par tone_t. Les erreurs,
# communes à tous les rôles, se disent sans pronom. UDR-0089 (profil-eleve) : lignes à toucher ; lot E1 (mvp-teacher-student) : plus
# de carte bleue en tête, de code secret ni de « Se déconnecter » (dans « Mon compte »). Ces clés ne servent qu'à l'élève, d'où le
# tutoiement sans suffixe.
