              blank: "Saisissez votre ou vos prénoms."
              too_long: "Les prénoms comptent %{count} caractères au plus."
              invalid: "Les prénoms ne contiennent que des lettres, des espaces, des apostrophes et des tirets."
            gender:
              inclusion: "Choisissez votre genre."
            contact:
              blank: "Saisissez votre numéro de téléphone."
              invalid: "Saisissez un numéro ivoirien à 10 chiffres, par exemple 05 01 02 03 04."
