# Inscription enseignant en trois étapes (numéro, code, profil), deux voies (DRENA → établissement, ou lien d'invitation), et liste des établissements d'une DRENA (API) — ADR-0030, ADR-0050, ADR-0083, UDR-0007, UDR-0024, UDR-0054, UDR-0079, UDR enseignant §3.9
fr:
  activemodel:
    attributes:
      dtos/identity/teacher_registration_input:
        last_name: "Nom"
        first_name: "Prénom(s)"
        gender: "Genre"
        contact: "Numéro de téléphone"
        pin: "Code secret"
        drena_public_id: "DRENA"
        school_public_id: "Établissement"
        material_slug: "Matière enseignée"
