# Page d'un exercice (plan boucle-pedagogique, Lot C1 ; reorganisation-equipe-enseignant, Lot F) — ADR-0033, ADR-0054, UDR-0007,
# UDR-0021 (épurée pour l'élève, UDR-0057), UDR-0069 §3.8 (« Assigner à mes classes »)
fr:
  assessment:
    exercises:
      show:
        page_title: "%{title}"
        # Enseignant et équipe seulement : l'élève lit le cours seul, la fiche est dans le lien retour (UDR-0021, 2026-10-02).
        context: "%{course} · Fiche de révision : %{essential}"
        exercise_types:
          fixation: "Fixation"
          evaluation: "Évaluation"
        questions:
          zero: "Aucune question"
          one: "1 question"
          other: "%{count} questions"
        actions: "Actions pour %{name}"
        assign_title: "Assigner à mes classes"
        assign_targets: "Assigner « %{title} » à vos classes"
        # level : « Tle D », « 3ème ».
        assign_none: "Aucune de vos classes n'est en %{level}."
        # UDR exercice sur feuille et copie à rendre (refonte-page-lecon) §3.8.
        sheet_title: "Sujet"
        start: "Faire l'exercice"
        resume: "Reprendre ma copie"
        restart: "Recommencer"
        redo: "Refaire l'exercice"
        # ADR-0115 : pause après 3 copies vérifiées d'affilée ; time : « 10 h 50 ».
        paused: "Tu pourras recommencer à %{time}."
        best: "Meilleure note : %{grade}/20"
        lesson_wide: "Toute la leçon"
        several_answers: "Plusieurs réponses"
        no_questions: "Cet exercice n'a pas encore de questions."
      solution:
        title: "Solution"
        or: " ou "
        tolerance: "(à %{tolerance} près)"
      questions_preview:
        answers: "Propositions"
        correct: "Proposition correcte"
