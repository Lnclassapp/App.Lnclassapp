# Compréhension d'un exercice assigné (ADR-0079, UDR-0072 §3.7) — écrans enseignant seulement.
# « session » et non « essai » (trends.single, section.first_rate*, no_trend) : vocabulaire de l'UDR-0007, vérifié par locale_files_test.
fr:
  assessment:
    comprehension:
      categories:
        struggling: "En difficulté"
        fragile: "Fragile"
        acquired: "Acquis"
        unreadable: "Pas encore lisible"
      trends:
        progress: "En progrès"
        decline: "En baisse"
        stable: "Stable"
        stagnant: "Stagne"
        single: "1 session"
      done_ratio: "%{done}/%{present}"
      badges_label: "Badges de la classe"
      badge_count: "%{count} %{level}"
      # UDR enseignant §3.8, §3.12 : une case du rapport se lit « 3 élèves Or ».
      badge_box:
        one: "%{count} élève %{level}"
        other: "%{count} élèves %{level}"
      badge_none: "Pas encore"
      progress:
        label: "Élèves qui ont fait l'exercice"
        done:
          one: "%{count} / %{total} fait"
          other: "%{count} / %{total} faits"
        late: "%{count} en retard"
      section:
        title: "Compréhension"
        badges_label: "Élèves par badge"
        questions_title: "Questions"
        students_title: "Élèves"
        question_label: "Question %{number} : %{rate} de réussite"
        question_number: "Q%{number}"
        no_attempt: "—"
        first_rate: "1re session : %{rate}"
        first_rate_label: ", %{rate} à la première session"
        to_revisit: "À reprendre en classe"
        to_revisit_label: ", à reprendre en classe"
      # La phrase assemble les trois groupes, chacun au pluriel : « 8 en progrès · 7 sans évolution · 3 en baisse ».
      trends_summary:
        sentence_html: "%{progress} · %{flat} · %{decline}"
        progress:
          one: "%{count} en progrès"
          other: "%{count} en progrès"
        flat:
          one: "%{count} sans évolution"
          other: "%{count} sans évolution"
        decline:
          one: "%{count} en baisse"
          other: "%{count} en baisse"
      no_trend: "Pas encore de progrès à lire : chaque élève n'a fait qu'une session."
      # AS-23 (ADR-0097 §4.6, UDR-0109 §3.3, UDR enseignant §3.8) : une phrase par cas, choisie par Entities::Assessment::NextStep,
      # dite en badges.
      next_step:
        label: "Prochain geste"
        remind:
          one: "Relancez l'élève qui ne l'a pas encore fait : les badges de la classe se liront à partir de %{min} élèves."
          other: "Relancez les %{count} élèves qui ne l'ont pas encore fait : les badges de la classe se liront à partir de %{min} élèves."
        look_at_each: "Tous les élèves l'ont fait. La classe est trop petite pour comparer les badges : regardez chaque élève."
        revisit_notion:
          one: "%{count} élève n'a pas encore de badge. Reprenez la notion en classe avant d'avancer, puis relancez-le."
          other: "%{count} élèves n'ont pas encore de badge. Reprenez la notion en classe avant d'avancer, puis relancez-les."
        revisit_questions: "La plupart des élèves en sont au Bronze : reprenez en classe les questions marquées, puis avancez."
        watch_decline:
          one: "La classe a atteint l'Argent ou mieux. Un élève est en baisse : voyez-le dans la liste."
          other: "La classe a atteint l'Argent ou mieux. %{count} élèves sont en baisse : voyez-les dans la liste."
        move_on: "La classe a atteint l'Argent ou mieux : vous pouvez avancer."
      empty:
        title: "Personne n'a encore fait cet exercice."
        description: "La compréhension s'affiche dès le premier exercice rendu."
      empty_category: "Aucun élève n'a ce badge."
      pending:
        title:
          one: "Pas encore fait · 1"
          other: "Pas encore faits · %{count}"
