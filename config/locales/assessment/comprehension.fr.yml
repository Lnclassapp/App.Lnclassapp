# Compréhension d'un exercice assigné (ADR-0079, UDR-0072 §3.7) — écrans enseignant seulement.
# « session » et non « essai » (trends.single) : vocabulaire de l'UDR-0007, vérifié par locale_files_test.
fr:
  assessment:
    comprehension:
      categories:
        struggling: "En difficulté"
        fragile: "Fragile"
        acquired: "Acquis"
        unreadable: "Pas encore lisible"
      trends:
        progress: "En progrès"
        decline: "En baisse"
        stable: "Stable"
        stagnant: "Stagne"
        single: "1 session"
      done_ratio: "%{done}/%{present}"
      badges_label: "Badges de la classe"
      badge_count: "%{count} %{level}"
      # UDR enseignant §3.8, §3.12 : une case du rapport se lit « 3 élèves Or ».
      badge_box:
        one: "%{count} élève %{level}"
        other: "%{count} élèves %{level}"
      badge_none: "Pas encore"
      progress:
        label: "Élèves qui ont fait l'exercice"
        done:
          one: "%{count} / %{total} fait"
          other: "%{count} / %{total} faits"
        late: "%{count} en retard"
      section:
        title: "Compréhension"
        badges_label: "Élèves par badge"
        questions_title: "Questions"
        students_title: "Élèves"
        question_number: "%{number}."
        no_attempt: "—"
        # « 18 / 20 justes » : les élèves listés qui ont juste, sur ceux qui ont fait la question (UDR enseignant §3.8).
        correct_of:
          one: "%{count} / %{answered} juste"
          other: "%{count} / %{answered} justes"
      # Une ligne de la liste « Élèves » : « Fait le 22 oct. » ou « Pas encore fait », et « En retard » après la date limite.
      student:
        done_on: "Fait le %{date}"
        done_format: "%-d %b"
        pending: "Pas encore fait"
        late: "En retard"
      # AS-23 (ADR-0097 §4.6, UDR-0109 §3.3, UDR enseignant §3.8) : une phrase par cas, choisie par Entities::Assessment::NextStep,
      # dite en badges.
      next_step:
        label: "Prochain geste"
        remind:
          one: "Relancez l'élève qui ne l'a pas encore fait : les badges de la classe se liront à partir de %{min} élèves."
          other: "Relancez les %{count} élèves qui ne l'ont pas encore fait : les badges de la classe se liront à partir de %{min} élèves."
        look_at_each: "Tous les élèves l'ont fait. La classe est trop petite pour comparer les badges : regardez chaque élève."
        revisit_notion:
          one: "%{count} élève n'a pas encore de badge. Reprenez %{target} en classe, puis relancez-le."
          other: "%{count} élèves n'ont pas encore de badge. Reprenez %{target} en classe, puis relancez-les."
        revisit_questions: "La plupart des élèves en sont au Bronze : reprenez en classe %{target}, puis avancez."
        # Ce que la phrase invite à reprendre : la question la moins réussie de la classe, à défaut la notion ou les questions.
        target:
          question: "la question %{number}"
          notion: "la notion"
          questions: "les questions les moins réussies"
        watch_decline:
          one: "La classe a atteint l'Argent ou mieux. Un élève est en baisse : consultez sa fiche."
          other: "La classe a atteint l'Argent ou mieux. %{count} élèves sont en baisse : consultez leurs fiches."
        move_on: "La classe a atteint l'Argent ou mieux : vous pouvez avancer."
      empty:
        title: "Personne n'a encore fait cet exercice."
        description: "La compréhension s'affiche dès le premier exercice rendu."
      empty_category: "Aucun élève n'a ce badge."
