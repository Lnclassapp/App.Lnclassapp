# Résultat d'une session (AS-11 à AS-13) — Lot C3, UDR-0023, UDR-0087 §3.6 ; vocabulaire de l'UDR-0007
# Phrase de progrès de l'élève : UDR-0073 §3, à la lettre ; jamais « stagne », « baisse » ni « essai ». Le cas « stagnant » n'est plus dit (UDR écrans élève §3.5).
# Les encouragements reprennent la locale de gamification de l'ancienne application.
fr:
  assessment:
    session_results:
      show:
        page_title: "Résultat de %{title}"
        # UDR-0140 : l'appréciation d'un professeur, sur la note sur 20 affichée (Appreciation).
        headline:
          very_good: "Très bien"
          good: "Bien"
          fair: "Assez bien"
          needs_work: "À retravailler"
        cheers:
          success:
            - "Hum ! Regarde comment ton ❤️ bat. C'est magnifique !"
            - "Je suis fier de toi, continue comme ça ! 💪"
            - "Quel génie ! Einstein n'a qu'à bien se tenir. 🧠"
            - "C'est du propre ! Tu maîtrises le sujet. ✨"
            - "Boom ! Dans le mille ! 🎯"
            - "Ton cerveau est en feu aujourd'hui ! 🔥"
            - "Impressionnant ! Tu es sur la voie royale. 👑"
          error:
            - "Tu as tapé petit poteau, mais le match continue ! ⚽"
            - "Oups ! C'était presque ça. On ne lâche rien ! 👊"
            - "Erreur de parcours, mais tu vas te rattraper ! 🚀"
            - "Même les meilleurs font des erreurs. Respire et recommence ! 🧘"
            - "Petit raté, mais la prochaine sera la bonne ! 🎯"
            - "Ce n'est pas grave, c'est comme ça qu'on apprend. 📚"
            - "Garde le cap, l'effort finit toujours par payer ! ⚓"
        student: "Session de %{name}"
        exercise: "Exercice : %{title}"
        grade: "Note"
        score: "Score"
        score_value: "%{score} %"
        mastery: "Maîtrise"
        correct: "Juste"
        wrong: "Faux"
        unanswered: "Sans réponse"
        back_to_lesson: "Retour à la leçon"
        correct_value: "%{count} sur %{total}"
        restart: "Recommencer"
        review_title: "Correction question par question"
        review_hint_student: "Pour chaque question : ta réponse, la bonne réponse et l'explication."
        review_hint_reveal: "Les propositions correctes sont marquées, comme les choix de l'élève."
        # Points (UDR-0140 §3) : seulement quand l'exercice n'est pas tout à 1 point, ou qu'il a des réponses rédigées.
        points_graded:
          one: "%{points} point sur %{total} corrigés automatiquement"
          other: "%{points} points sur %{total} corrigés automatiquement"
        points_manual:
          one: "%{points} point à comparer au corrigé"
          other: "%{points} points à comparer au corrigé"
        # « À revoir » (CA-09, CA-10) ; %{questions} : « question 2 » ou « questions 2 et 4 », chaque numéro est un lien.
        to_review_essential_html: "À revoir : « %{essential} », %{questions}"
        to_review_lesson_html: "À revoir dans la leçon : %{questions}"
        review_questions_html:
          one: "question %{numbers}"
          other: "questions %{numbers}"
        whole_lesson: "Toute la leçon"
        restart_pause: "Tu pourras recommencer à %{time}."
      question_review:
        number: "Question %{number}"
        verdict:
          success: "Bonne réponse"
          error: "Mauvaise réponse"
          none: "Sans réponse"
        selected: "Ta réponse"
        right_answer: "Bonne réponse"
        compare: "À comparer au corrigé"
        nothing_written: "Tu n'as rien écrit."
        model_answer: "Corrigé"
        criteria: "Grille de vérification"
        accepted: "Réponses acceptées"
        expected: "Valeur attendue"
        right_order: "Bon ordre"
        right_pairs: "Bonnes paires"
        student_choice: "Choix de l'élève"
        answers: "Propositions"
        correct: "Proposition correcte"
        explanation: "Explication"
      progress:
        progress: "Tu progresses : %{first}/20 à ta première session, %{current}/20 aujourd'hui."
        stable: "Tu confirmes ta maîtrise : %{current}/20."
        decline: "Ton meilleur résultat reste %{best}/20. Relis la correction, tu peux le retrouver."
      badge:
        label: "Badge %{level}"
        new: "Nouveau badge !"
        none: "Pas encore de badge"
        help: "Badges"
      # UDR-0120 : l'effet de la session sur sa fiche (ADR-0101 §4.3), à l'élève seul ; grade = note sur 20 du seuil de
      # remédiation (Grading.grade_on_20(REMEDIATION_THRESHOLD)). Aucun pourcentage.
      gap_outcome:
        opened:
          message: "Cette notion passe à revoir."
          hint: "Refais l'exercice de « %{essential} » et vise au moins %{grade}/20."
        still_pending:
          message: "Encore à revoir."
          hint: "Pour lever « %{essential} », vise au moins %{grade}/20."
        lifted:
          message: "Notion levée !"
          hint: "« %{essential} » n'est plus à revoir."
        open_essential: "Refaire l'exercice"
