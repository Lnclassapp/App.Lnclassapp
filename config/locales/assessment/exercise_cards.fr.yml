# La carte d'exercice et la carte de question — UDR-0145 (§3.1, §3.3)
fr:
  assessment:
    exercises:
      card:
        # Le verbe de la carte : ce que l'élève, l'enseignant ou l'équipe fait en la touchant.
        view_copy: "Voir ma copie"
        follow: "Voir le suivi"
        # « Matière · Type » et « 16/20 · Acquis ».
        separator: " · "
        pending: "%{count} pas encore"
      show:
        # Le format de chaque question, dit avant ses propositions (UDR-0145 §3.3) ; l'élève ne lit jamais le nombre de bonnes propositions.
        question_number: "Question %{number}, "
        question_formats:
          true_false: "Vrai ou faux"
          single_choice: "Une seule réponse"
          multiple_correct_2: "Plusieurs réponses"
          multiple_correct_3: "Plusieurs réponses"
          fill_blank: "Texte à trous"
          numeric: "Réponse en nombre"
          ordering: "Remettre dans l'ordre"
          matching: "Relier"
          select: "Choix dans une liste"
          written: "Réponse rédigée"
          notebook: "Sur le cahier"
