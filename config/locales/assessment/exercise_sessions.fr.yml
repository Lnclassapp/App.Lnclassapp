# Session d'exercice (AS-07 à AS-11) — Lot C2, UDR-0022 (épurée, UDR-0057), UDR-0087 (mode concentré, nouveaux types) ; vocabulaire de l'UDR-0007
fr:
  activemodel:
    attributes:
      dtos/assessment/attempt_input:
        answer_ids: "Propositions"
        response_text: "Ta réponse"
        display_order: "Ta réponse"
    errors:
      models:
        dtos/assessment/attempt_input:
          attributes:
            answer_ids:
              blank: "Sélectionne au moins une proposition."
              wrong_selection: "Coche le nombre de propositions demandé, parmi celles de la question."
            response_text:
              blank: "Écris ta réponse."
              too_long: "Ta réponse est trop longue : %{count} caractères au plus."
              text_too_long: "Ta réponse est trop longue : 2 000 caractères au plus."
              blank_text: "Écris ta réponse dans le blanc."
              invalid: "Ta réponse contient un caractère interdit."
              not_a_number: "Écris un nombre, par exemple -3,5."
            display_order:
              wrong_order: "Range toutes les étapes, chacune une seule fois."
              incomplete_pairs: "Relie chaque élément de gauche à un seul élément de droite."
            base:
              already_answered: "Tu as déjà répondu à cette question."
              session_closed: "Cette session est terminée."
  assessment:
    exercise_sessions:
      show:
        page_title: "Copie · %{title}"
        counter: "%{answered}/%{total} répondues"
        statement: "Sujet"
        review_statement: "Revoir le sujet"
        question: "Question %{number}"
        # UDR-0140 §3 : « (2 points) », « (1,5 point) » ; seulement quand l'exercice n'est pas tout à 1 point.
        points:
          one: "(%{points} point)"
          other: "(%{points} points)"
        submit: "Vérifier ma copie"
        submitting: "Vérification…"
        # UDR-0140 : la phrase juste au-dessus du bouton ; la copie part d'un seul envoi.
        lock_warning: "Une fois ta copie vérifiée, tu ne pourras plus changer tes réponses."
        confirm_title: "Vérifier ta copie ?"
        missing:
          one: "1 question sans réponse comptera fausse."
          other: "%{count} questions sans réponse compteront fausses."
        confirm: "Vérifier quand même"
        keep_going: "Continuer ma copie"
        offline: "Copie non envoyée : vérifie ta connexion. Tes réponses sont gardées."
        abandoned: "Cette session a été remplacée par une nouvelle. Reprends l'exercice depuis sa page."
        # UDR-0147 je-m-entraine-dans-la-fiche §3.8 : l'indice d'une question et les cases de sa phrase.
        hint_notice: "Les indices ne changent pas ta note ; ton enseignant voit ceux que tu as ouverts."
        hint_button: "Indice"
        hint_text: "Indice : %{text}"
        blank_label: "Case %{index} de la question %{number}"
        blank_label_unit: "Case %{index} de la question %{number}, en %{unit}"
      kinds:
        fill_blank:
          legend: "Complète la phrase."
          blank: "blanc"
        numeric:
          label: "Ta réponse"
          sign: "Changer le signe"
          hint: "± pour un nombre négatif ; virgule pour les décimales."
          invalid: "Écris un nombre, par exemple -3,5."
        select:
          legend: "Choisis dans la liste."
          choose: "— choisir —"
          blank: "blanc"
        written:
          label: "Ta réponse"
          counter: "%{count} / %{max}"
        notebook:
          to_do: "À faire sur ton cahier"
        ordering:
          hint: "Utilise les flèches pour ranger les étapes, de la première à la dernière."
          steps: "Étapes"
          up: "Monter l'étape %{n}"
          down: "Descendre l'étape %{n}"
          moved: "Étape déplacée en position %{n}."
          rank: "Étape %{n}"
        matching:
          hint: "Touche un élément à gauche, puis celui qui va avec à droite."
          left: "À relier"
          right: "Réponses"
          linked: ", relié à %{x}"
          choose: "Choisis…"
          with: "relié à"
      question_card:
        # Plusieurs réponses seulement : les boutons radio portent déjà la consigne d'une réponse unique (UDR-0022, 2026-10-02).
        hint: "Coche %{count} propositions."
    exercise_copies:
      create:
        archived: "Cet exercice a été retiré."
    question_attempts:
      create:
        success: "Bonne réponse."
        error: "Mauvaise réponse."
