# Shell applicatif par rôle : en-tête, navigation, accueil — UDR-0006, UDR-0052, UDR-0056, UDR-0068, UDR-0071, UDR-0074, UDR-0078, UDR-0080, UDR-0082, UDR-0084, UDR-XXXX (écrans enseignant et élève sans répétition, accueil élève)
fr:
  layouts:
    shell:
      skip: "Aller au contenu"
  shared:
    roles:
      student: "Élève"
      teacher: "Enseignant"
      team: "Équipe"
      school_admin: "Direction"
    navigation:
      home: "Accueil"
      courses: "Cours"
      classroom: "Ma classe"
      classrooms: "Classes"
      schools: "Établissements"
      imports: "Imports"
      referential: "Référentiel"
      dashboard: "Pilotage"
      teachers: "Enseignants"
      school: "Établissement"
      announcements: "Annonces"
      profile: "Mon profil"
      sign_out: "Se déconnecter"
      header:
        account: "Mon compte"
      # UDR-0080 §3.1, §3.2 : panneau du compte (site : <dialog> ; app : page /students/menu, /teachers/menu). Plein écran
      # « Mon compte » pour les deux rôles (UDR élève §3.1, UDR enseignant §3.4). « Mon profil » et « Se déconnecter » reprennent
      # shared.navigation.profile et .sign_out.
      account_panel:
        title: "Mon compte"
        open: "Ouvrir le menu du compte"
        label: "Menu du compte"
        close: "Fermer"
        # Entrées de l'élève (secret, mode sombre) et de l'enseignant (les quatre) ; UDR-XXXX §3.1 et §3.4.
        entries:
          secret: "Modifier mon code secret"
          school: "Mon établissement"
          add_material: "Ajouter une matière"
          add_school: "Ajouter un établissement"
          dark_mode: "Mode sombre"
        # Compteur sous « Ajouter une matière / un établissement » : sous le plafond, puis au plafond (l'entrée passe en gris
        # et mène à l'écran de retrait).
        counter:
          under: "%{used} sur %{max}"
          full: "%{used} sur %{max} · retire-en un pour en ajouter"
        # UDR-0098 §3.1 : entrée « Mes établissements » et rubrique « Établissement » (à partir de deux établissements)
        schools:
          link: "Mes établissements"
          title: "Établissement"
          current_heading: "Établissement en cours"
          primary: "Principal"
          switch: "Passer à %{school}"
          current: "%{school}, établissement actuel"
      # UDR-XXXX accueil élève §3.1, UDR enseignant §3.3 : bandeau des deux accueils (shared/navigation/_home_band) ; l'avatar
      # ouvre « Mon compte », « Besoin d'aide ? » ouvre l'aide.
      home_band:
        account: "Mon compte, %{name}"
        help: "Besoin d'aide ?"
      # Lot E1 (mvp-teacher-student) : l'avatar de l'élève ouvre « Mon compte » (account_panel.title, entries.*, sign_out) ; `open`
      # nomme le déclencheur. `history` et `add_photo` ne servent plus qu'à la branche élève de _account_panel, qu'aucune page ne rend.
      avatar_menu:
        open: "Mon compte, %{name}"
        history: "Mon historique"
        add_photo: "Ajouter ma photo"
      sidebar:
        label: "Navigation principale"
        # UDR-0068 §3.1 : titre de la 2e carte, par rôle ayant une liste secondaire.
        secondary_label:
          team: "Configuration"
      bottom_bar:
        label: "Navigation principale"
        more: "Plus"
        more_label: "Plus de destinations : %{entries}"
      # UDR-0078 §3.1 : bandeau d'installation, élève (tutoiement) et enseignant (vouvoiement), dans le shell
      install_banner:
        title:
          student: "Installe Lnclass sur ton téléphone"
          teacher: "Installez Lnclass sur votre téléphone"
        body:
          student: "Retrouve tes fiches de cours et tes exercices en un geste, depuis ton écran d'accueil."
          teacher: "Retrouvez vos classes en un geste, depuis votre écran d'accueil."
        ios_share:
          student_html: "Touche <strong>Partager</strong>"
          teacher_html: "Touchez <strong>Partager</strong>"
        ios_add:
          student_html: "Puis <strong>Sur l'écran d'accueil</strong>"
          teacher_html: "Puis <strong>Sur l'écran d'accueil</strong>"
        install: "Installer"
        later: "Plus tard"
    home:
      skeleton:
        greeting: "Bonjour, %{name}"
        subtitle:
          student: "Voici ce qui t'attend aujourd'hui."
          teacher: "Vos classes et vos élèves, en un coup d'œil."
          team: "L'état de la plateforme, région par région."
          school_admin: "Votre établissement, ses classes et son équipe."
      sections:
        todo:
          title: "À faire"
          subtitle: "Les exercices donnés par tes enseignants"
          empty: "Rien à faire pour l'instant"
        subjects:
          title: "Mes matières"
          subtitle: "Les fiches de cours de ton niveau, matière par matière"
          empty: "Aucune matière pour l'instant"
        announcements:
          title: "Annonces"
          subtitle: "Ce que t'annoncent tes enseignants, ta direction et Lnclass"
          empty: "Aucune annonce pour le moment"
        classroom:
          title: "Ma classe"
          subtitle: "Tes enseignants et tes camarades"
          empty: "Tu n'as pas encore rejoint de classe"
        courses:
          title: "Fiches de cours"
          subtitle: "Le catalogue, classé par niveau et par matière"
          empty: "Aucune fiche de cours pour l'instant"
        classrooms:
          title: "Mes classes"
          subtitle: "Les classes dans lesquelles vous enseignez"
          empty: "Aucune classe pour l'instant"
        activity:
          title: "Activités"
          subtitle: "Ce qui s'est passé récemment"
          empty: "Aucune activité récente"
        # UDR enseignant §3.3 : l'historique des exercices échus (titre lu par les lecteurs d'écran seulement sur l'accueil)
        history:
          title: "Historique"
          subtitle: "Les exercices échus de vos classes"
          empty: "Aucun exercice échu pour l'instant"
        regions:
          title: "Régions éducatives"
          subtitle: "Les DRENA de Côte d'Ivoire"
          empty: "Aucune DRENA enregistrée"
        levels:
          title: "Structure scolaire"
          subtitle: "Les niveaux, de la 6e à la terminale"
          empty: "Aucun niveau enregistré"
        overview:
          title: "Tableau de bord"
          subtitle: "Classes, élèves et enseignants de l'établissement"
          empty: "Aucune donnée pour l'instant"
