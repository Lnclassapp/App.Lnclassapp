# Document HTML commun — ADR-0051 ; titre de l'onglet et messages des briques de finition — UDR-0054
fr:
  layouts:
    outdated_browser: "Votre navigateur est ancien : l'affichage peut être dégradé."
  shared:
    # « Page · Espace · Lnclass » (UDR-0054 §3.1) : l'espace du rôle connecté ; une page publique n'en a pas.
    page_title:
      spaces:
        student: "Élève"
        teacher: "Enseignant"
        team: "Équipe"
        school_admin: "Direction"
    # Toasts du bouton « Copier » (UDR-0054 §3.5)
    clipboard:
      copied_link: "Lien copié."
      copied_code: "Code copié."
      copied_codes: "Codes copiés."
      failed: "La copie a échoué : sélectionnez le texte et copiez-le à la main."
    # Région d'état d'un formulaire à envoi automatique (UDR-0054 §3.6)
    autosubmit:
      sending: "Envoi du code…"
      hint_second_factor: "Le code est envoyé dès le 6ᵉ chiffre."
      hint_join: "La classe s'ouvre dès le code complet."
    # Textes d'infobulle communs à plusieurs écrans (UDR-0054 §3.4, à valider par le porteur dans la PR).
    # Les textes propres à un écran vont dans la locale de l'écran.
    info_tips:
      badges: "Bronze à partir de 50 %, Argent à partir de 70 %, Or à partir de 80 %, Diamant à 100 %."
      mastery: "Acquis : 70 % et plus. Fragile : de 50 à 69 %. En difficulté : moins de 50 %."
      school_status: "Brouillon : pas encore ouvert aux inscriptions. Actif : les enseignants s'y inscrivent. Désactivé : il n'apparaît plus à l'inscription ni à la création de classe."
