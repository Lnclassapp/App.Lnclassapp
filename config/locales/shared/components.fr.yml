# Bibliothèque de composants (app/views/components) — UDR-0005
fr:
  components:
    button:
      loading: "Chargement en cours"
    modal:
      close: "Fermer"
    toast:
      dismiss: "Fermer la notification"
      titles:
        success: "C'est fait"
        info: "Information"
        warning: "Attention"
        error: "Une erreur est survenue"
    error_state:
      title: "Impossible d'afficher ce contenu"
      message: "Vérifiez votre connexion, puis réessayez."
      retry: "Réessayer"
    loading_state:
      label: "Chargement…"
    field:
      # Bouton œil d'un champ PIN (UDR-0051), libellé qui suit l'état
      reveal:
        show: "Afficher le code"
        hide: "Masquer le code"
    # UDR-0054 §3.2 et §3.4 — retour et infobulle
    back_link:
      label: "Retour"
    info_tip:
      label: "Aide : %{label}"
    # UDR-0057 R3 — « Voir plus » (contrôleur reveal) ; « {count} » est remplacé côté navigateur, pas par I18n
    reveal:
      more: "Voir plus"
      announce_one: "1 ligne de plus affichée."
      announce_other: "{count} lignes de plus affichées."
    pagination:
      label: "Pagination"
      previous: "Précédent"
      next: "Suivant"
      status: "Page %{page} sur %{pages}"
    rich_text_editor:
      # Textes de la barre d'outils de Trix, passés au contrôleur rich-text-editor (clés de Trix.config.lang).
      lang:
        bold: "Gras"
        bullets: "Liste à puces"
        code: "Code"
        heading1: "Titre"
        indent: "Augmenter le retrait"
        italic: "Italique"
        link: "Lien"
        numbers: "Liste numérotée"
        outdent: "Diminuer le retrait"
        quote: "Citation"
        redo: "Rétablir"
        remove: "Retirer"
        strike: "Barré"
        undo: "Annuler"
        unlink: "Retirer le lien"
        url: "Adresse du lien"
        urlPlaceholder: "Saisissez une adresse…"
        # Légende d'une image du blog (UDR-0067 §3.4.4) : visible sous l'image, distincte du texte de remplacement.
        captionPlaceholder: "Ajoutez une légende…"
        # Bouton d'envoi de fichier de la barre, présent dans l'éditeur du blog seul (« Attach Files ») : il insère une image.
        attachFiles: "Insérer une image"
