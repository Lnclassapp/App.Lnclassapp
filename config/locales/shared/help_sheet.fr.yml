# Carte d'aide « Besoin d'aide ? » (shared/_help_sheet, SupportHelper) — UDR-0061 §3.5. Tutoiement de l'espace élève.
# Aucun numéro ici : ils sont dans config/support.yml.
fr:
  shared:
    help_sheet:
      trigger: "Besoin d'aide ?"
      title: "Contacte-nous"
      faq:
        title: "Questions fréquentes"
        hint: "Les réponses aux questions les plus posées"
      whatsapp:
        title: "Chatter avec le support"
        hint: "%{hours} · %{reply}"
        # Sans horaires ni délai fournis par le porteur : une ligne courte, jamais une valeur inventée.
        hint_default: "Réponse par message"
        external: "(ouvre WhatsApp)"
      call:
        title: "Appeler le service client"
        hint: "%{hours}"
      # UDR-0064 §3.5 (amendement de l'UDR-0061 §3.3) : pied de la carte, libellés de public_pages.links.
      footer:
        label: "Plus sur Lnclass"
