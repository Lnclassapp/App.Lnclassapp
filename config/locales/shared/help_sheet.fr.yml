# Carte d'aide « Besoin d'aide ? » (shared/_help_sheet, SupportHelper) — UDR-0061 §3.5. Tutoiement de l'espace élève.
# Aucun numéro ici : ils sont dans config/support.yml.
fr:
  shared:
    help_sheet:
      trigger: "Besoin d'aide ?"
      title: "Contacte-nous"
      faq:
        title: "Questions fréquentes"
        hint: "Les réponses aux questions les plus posées"
      whatsapp:
        title: "Chatter avec le support"
        hint: "%{hours} · %{reply}"
        # Sans horaires ni délai fournis par le porteur : une ligne courte, jamais une valeur inventée.
        hint_default: "Réponse par message"
        external: "(ouvre WhatsApp)"
        # UDR-0128 : message prêt du lien wa.me, modifiable avant l'envoi : nom, rôle, établissement. Jamais le numéro
        # (WhatsApp le transmet), ni le PIN, ni un code, ni un identifiant. Espace final : on écrit à la suite.
        message:
          plain: "Bonjour Lnclass, ma question : "
          introduced: "Bonjour Lnclass, je suis %{who}. Ma question : "
          student: "élève de %{classroom}"
          student_alone: "élève"
          teacher:
            male: "enseignant de %{material}"
            female: "enseignante de %{material}"
          teacher_alone:
            male: "enseignant"
            female: "enseignante"
          school_admin: "membre de la direction"
      call:
        title: "Appeler le service client"
        hint: "%{hours}"
      # UDR-0066 §3.5 (amendement de l'UDR-0061 §3.3) : pied de la carte, libellés de public_pages.links.
      footer:
        label: "Plus sur Lnclass"
