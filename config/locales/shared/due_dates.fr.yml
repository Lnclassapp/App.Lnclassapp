# Échéances des exercices assignés, rendues par DueDateHelper seul (ADR-0072, UDR-0062 §3.1, charte §12).
# Les noms abrégés des jours de rails-i18n (« lun ») n'ont pas de point : due_short l'ajoute (« lun. 12 oct. »).
fr:
  date:
    formats:
      due_short: "%a. %-d %b"
      due_long: "%A %-d %b"
      due_weekday: "%A"
  due_dates:
    badge:
      today: "À rendre aujourd'hui"
      tomorrow: "À rendre demain"
      weekday: "À rendre %{day}"
      later: "À rendre %{date}"
      late_yesterday: "En retard · prévu hier"
      late: "En retard · prévu %{date}"
    teacher:
      due: "Pour %{date}"
      none: "Sans date limite"
