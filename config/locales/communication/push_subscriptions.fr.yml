# notifications-push, Lot A (UDR-0186 §3.1) : la carte d'invitation sous un résultat réussi et les messages des
# retours de « Couper » / « Réactiver ». Tutoiement. Le texte des notifications elles-mêmes est dans push.fr.yml.
fr:
  communication:
    push_subscriptions:
      invitation:
        title: "Être prévenu de tes devoirs et de tes interros ?"
        body: "Lnclass t'envoie un rappel la veille d'un devoir ou d'une interro, quand l'équipe publie une annonce, quand tu gagnes une médaille ou laisses un exercice en plan."
        bullets:
          - "Jamais la nuit ni pendant les cours."
          - "Ni ton nom ni tes notes sur l'écran du téléphone."
          - "Tu arrêtes quand tu veux, dans ton profil."
        accept: "Oui, me prévenir"
        later: "Plus tard"
        loading: "Un instant…"
        success: "C'est noté. Tu seras prévenu."
        error: "Ça n'a pas marché. Réessaie plus tard."
        blocked: "Ton navigateur a bloqué les notifications. Tu peux les autoriser dans ses réglages."
    push_preferences:
      update:
        turn_off: "C'est coupé. Tu ne recevras plus de notifications."
        turn_on: "C'est réactivé."
