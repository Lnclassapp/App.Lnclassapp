# « Protection des données » (/confidentialite) — UDR-0063, texte de docs/chantiers/fonctions-espace-eleve/pages-publiques.md §2, au vouvoiement
fr:
  communication:
    pages:
      privacy:
        page_title: "Protection des données"
        title: "Protection de vos données personnelles"
        updated_on: "2 octobre 2026"
        sections:
          qui-est-responsable:
            title: "1. Qui est responsable de vos données"
            paragraphs:
              - "Lnclass est utilisé par des élèves, souvent mineurs, par leurs enseignants et par leurs établissements. Cette politique dit quelles données nous enregistrons, pourquoi, qui les voit, combien de temps nous les gardons et comment exercer vos droits."
              - "Le responsable du traitement est Lnclass Côte d'Ivoire SARL, Tiassalé, au feu du marché, vers la Pharmacie Saint-Joseph, Côte d'Ivoire — RCCM ‹ numéro : à compléter par les juristes ›."
              - "Pour toute question sur vos données : +225 05 44 32 00 20 ou +225 05 84 25 80 85."
          cadre-applicable:
            title: "2. Le cadre applicable"
            paragraphs:
              - "Ce traitement relève de la loi ivoirienne n° 2013-450 du 19 juin 2013 relative à la protection des données à caractère personnel. L'autorité de contrôle est l'ARTCI (Autorité de Régulation des Télécommunications/TIC de Côte d'Ivoire). ‹ Déclaration ou autorisation auprès de l'ARTCI et sa référence : à compléter par les juristes ›"
          donnees-collectees:
            title: "3. Les données que nous enregistrons"
            paragraphs: []
            items:
              - "Identité : nom, prénom(s), genre. Qui est concerné : tous les comptes."
              - "Contact : numéro de téléphone ivoirien, qui sert aussi à se connecter. Qui est concerné : tous les comptes."
              - "Code secret : 4 chiffres, jamais enregistré en clair. Qui est concerné : tous les comptes."
              - "Rattachement : rôle (élève, enseignant, direction, équipe), classe et dates d'arrivée et de départ, établissement, matière enseignée, classes déclarées, jours de séance de l'enseignant. Qui est concerné : selon le rôle."
              - "Photo de profil, facultative : image carrée, dont nous retirons les informations cachées (lieu, appareil) avant de la garder. Qui est concerné : comptes qui en ajoutent une."
              - "Travail scolaire : exercices commencés et terminés, réponses, notes, badges, fiches à revoir. Qui est concerné : élèves."
              - "Travail de l'enseignant : exercices donnés à ses classes et leurs dates limites. Qui est concerné : enseignants."
              - "Sécurité : connexions ouvertes (adresse IP, navigateur, dates), tentatives de connexion (numéro saisi, adresse IP, réussite ou échec), codes de récupération du code secret (sous forme non lisible) ; pour l'équipe, le second facteur. Qui est concerné : tous les comptes."
              - "Journal des actions sensibles : qui a fait quoi et quand (verrouillage, code secret réinitialisé, changement de nom, de numéro ou de photo, publication d'un contenu, retrait d'un enseignant), avec l'adresse IP ; jamais un code secret. Qui est concerné : comptes qui font ces actions, et comptes concernés."
              - "Invitations et parrainage : numéro d'une personne invitée (direction, équipe), qui a invité qui, canal de partage d'un lien (WhatsApp, SMS, copie). Qui est concerné : enseignants, direction, équipe."
              - "Ce que nous n'enregistrons pas : aucune adresse électronique, aucune date de naissance, aucune adresse postale ; aucun traceur publicitaire ni outil de mesure d'un tiers ; aucun cookie autre que celui qui vous garde connecté et celui qui retient, sur votre appareil, votre choix entre mode clair et mode sombre."
              - "Nos statistiques d'usage sont calculées, de façon agrégée, à partir des données ci-dessus."
          finalites:
            title: "4. Pourquoi nous les utilisons"
            paragraphs: []
            items:
              - "Créer votre compte et vous connecter. Données utilisées : identité, contact, code secret, connexions. Base légale : ‹ à compléter par les juristes ›"
              - "Protéger votre compte : verrouillage après plusieurs codes secrets faux, récupération du code secret, journal. Données utilisées : tentatives, codes, journal, adresse IP. Base légale : ‹ à compléter par les juristes ›"
              - "Faire fonctionner la classe : l'élève voit ses exercices, l'enseignant suit ses élèves. Données utilisées : rattachement, travail scolaire, exercices donnés. Base légale : ‹ à compléter par les juristes ›"
              - "Permettre à l'établissement de suivre le travail de ses élèves. Données utilisées : noms des élèves de ses classes et chiffres de leur travail. Base légale : ‹ à compléter par les juristes ›"
              - "Mesurer l'usage du service, de façon agrégée. Données utilisées : comptes, exercices faits, exercices donnés. Base légale : ‹ à compléter par les juristes ›"
              - "Faire connaître Lnclass entre collègues. Données utilisées : parrainage. Base légale : ‹ à compléter par les juristes ›"
          qui-voit-vos-donnees:
            title: "5. Qui voit vos données"
            paragraphs: []
            items:
              - "Vous voyez votre profil, votre numéro et votre travail."
              - "Vos camarades de classe voient le nombre d'élèves de la classe, jamais la liste des élèves ni leurs résultats."
              - "Une personne qui s'inscrit voit le nom des classes d'un établissement, et celle qui a le lien de votre classe voit son nom, celui de l'établissement et le niveau, pour reconnaître la bonne classe avant de la rejoindre ; jamais un élève, un enseignant ni l'effectif."
              - "L'enseignant de votre classe voit votre nom, votre photo et vos résultats, et qui a rendu un exercice en retard ; pas votre numéro. Il peut vous donner un code pour retrouver l'accès à votre compte."
              - "La direction de votre établissement voit ses enseignants, les élèves de ses classes et les chiffres de leur travail."
              - "L'équipe Lnclass voit tous les comptes, pour les débloquer et vous aider ; dans ses tableaux de suivi, le numéro est masqué."
              - "Nous ne vendons ni ne cédons vos données."
          ou-sont-vos-donnees:
            title: "6. Où sont vos données"
            paragraphs:
              - "L'application, sa base de données et les photos sont hébergées chez Railway, prestataire d'hébergement ; les photos sont dans un espace de stockage du même prestataire. ‹ Région d'hébergement et transferts hors de Côte d'Ivoire, avec leurs garanties : à compléter par les juristes ›"
              - "Les photos ne sont montrées que par l'application, à une personne connectée et autorisée ; elles n'ont pas d'adresse publique."
              - "Si vous écrivez au support par WhatsApp ou si vous l'appelez, l'échange passe par WhatsApp ou par votre opérateur téléphonique, hors de Lnclass."
          securite:
            title: "7. Comment nous les protégeons"
            paragraphs: []
            items:
              - "Les échanges avec l'application sont chiffrés (HTTPS)."
              - "Votre connexion se ferme après 30 jours sans activité ; pour l'équipe et la direction, après 12 heures au plus."
              - "Votre code secret et vos autres codes ne sont jamais enregistrés en clair. Après plusieurs codes secrets faux, le compte se verrouille."
              - "Les comptes de l'équipe exigent un second facteur."
              - "Aucun script d'un tiers n'est chargé dans les pages."
              - "Les informations cachées des photos (position GPS comprise) sont retirées avant l'enregistrement."
          conservation:
            title: "8. Combien de temps nous les gardons"
            paragraphs: []
            items:
              - "Vos données sont conservées comme archive, sans limite de durée, tant que vous ne demandez pas leur suppression : exercices faits, réponses, notes, badges et fiches à revoir. Elles servent à la progression et au suivi par les enseignants et l'établissement."
              - "Après votre départ d'une classe ou d'un établissement, cette archive reste consultable par vous, depuis votre compte, et par l'établissement que vous avez quitté, pour les résultats obtenus chez lui."
              - "Vous pouvez demander la suppression de votre compte au +225 05 44 32 00 20 ou au +225 05 84 25 80 85 : elle est faite dans les 30 jours qui suivent votre demande. Votre nom, votre numéro, votre code secret et votre photo sont effacés, et vos résultats aussi : exercices faits, réponses, notes, badges et fiches à revoir. Vous n'apparaissez plus dans aucun chiffre de vos classes ni de l'établissement."
              - "Les classes sont archivées en fin d'année scolaire, pas supprimées."
              - "Les fichiers envoyés mais jamais utilisés sont effacés après 48 heures."
          vos-droits:
            title: "9. Vos droits"
            paragraphs:
              - "Vous pouvez demander l'accès à vos données, leur rectification, vous opposer à leur traitement ou demander leur suppression, dans les conditions de la loi n° 2013-450. ‹ Formulation exacte des droits et recours auprès de l'ARTCI : à compléter par les juristes ›"
              - "Pour exercer vos droits : +225 05 44 32 00 20 ou +225 05 84 25 80 85."
              - "Sans attendre, vous pouvez vous-même modifier votre nom, votre numéro, votre code secret et votre photo depuis votre profil. La suppression d'un compte se demande au support : il est alors anonymisé."
          eleves-mineurs:
            title: "10. Les élèves mineurs"
            paragraphs:
              - "La plupart des élèves qui utilisent Lnclass ont moins de 18 ans. Un élève s'inscrit avec le code que lui donne son enseignant, dans le cadre de sa classe. ‹ Âge minimum pour s'inscrire seul et accord des parents : à compléter par les juristes ›"
          modification:
            title: "11. Modification de cette politique"
            paragraphs:
              - "Nous mettons cette page à jour quand l'application change ce qu'elle enregistre. La date de mise à jour est en tête de page."
