# Catalogue et page d'un cours (plan boucle-pedagogique, Lot B1, CA-01, CA-04, CA-10, CA-27) — UDR-0007, UDR-0013
fr:
  catalog:
    courses:
      index:
        page_title: "Cours"
        title: "Cours"
        subtitle: "Les fiches de cours du programme, par matière et par niveau."
        # UDR écrans élève §3.6 : la progression du programme s'écrit une fois, à la suite du compte.
        student_total: "%{total} · Progression DPFC 2026-2027"
        student_progression: "Progression DPFC 2026-2027"
        # Lot O5 (UDR écrans élève §3.6 bis) : Cours par leçons sur ordinateur, les pastilles des matières. Le compte reprend
        # « N fiches de cours · Progression DPFC » (UDR-0130 : le mot « leçon » n'est pas du vocabulaire de l'écran).
        lessons:
          materials_label: "Matières"
        # UDR-0013, amendement du 2026-10-02 : la portée du catalogue de l'élève, en infobulle (UDR-0057 R4).
        student_scope: "Tu vois seulement les fiches de cours de ton niveau."
        student_scope_label: "Quelles fiches de cours ?"
        # UDR enseignant §3.7 : « Cours de Tle D » depuis un rond de niveau de l'accueil ; la ligne de total dit la matière
        # (nom court) et la progression, une seule fois.
        teacher_title: "Cours de %{level}"
        teacher_total: "%{total} · %{material} · Progression DPFC 2026-2027"
        teacher_no_match_description: "Essayez un autre mot."
        # ADR-0103 §4.6 : aucune matière dans l'établissement courant
        teacher_no_material_title: "Choisissez vos matières"
        teacher_no_material_description: "Les fiches de cours de vos matières, aux niveaux de vos classes, apparaîtront ici."
        teacher_no_material_action: "Choisir mes matières"
        teacher_no_class_title: "Déclarez vos classes pour voir vos fiches de cours"
        teacher_no_class_description: "Les fiches de cours de votre matière, aux niveaux de vos classes, apparaîtront ici."
        teacher_no_class_action: "Déclarer mes classes"
        # UDR-0077, amendement du 2026-10-06 : quitter les filtres, à toutes les largeurs.
        reset: "Tout voir"
        new_course: "Nouvelle fiche de cours"
        import: "Importer des fiches de cours"
        filters:
          label: "Filtrer les fiches de cours"
          search: "Rechercher une fiche de cours"
          level: "Niveau"
          # UDR-0069 §3.4 : enseignant et équipe seulement.
          series: "Série"
          material: "Matière"
          all_levels: "Tous les niveaux"
          all_series: "Toutes les séries"
          all_materials: "Toutes les matières"
          all_teacher_materials: "Toutes vos matières"
          submit: "Filtrer"
        total:
          zero: "Aucune fiche de cours"
          one: "%{count} fiche de cours"
          other: "%{count} fiches de cours"
        empty_title: "Aucune fiche de cours pour l'instant"
        empty_description: "Les fiches de cours publiées apparaîtront ici."
        no_class_title: "Rejoins ta classe pour voir tes fiches de cours"
        no_class_description: "Les fiches de cours de ton niveau apparaîtront ici dès que tu seras dans une classe de cette année."
        no_match_title: "Aucune fiche de cours ne correspond"
        no_match_description: "Essayez un autre nom, un autre niveau ou une autre matière."
        # UDR-0085 §3.5 : l'élève n'a plus que la recherche.
        student_no_match_description: "Essaye un autre mot."
        clear_search: "Effacer la recherche"
      teacher_header:
        back: "Accueil"
        chips_label: "Matière"
      # Lot E4 (politique-cache, UDR-0013 amendement du 2026-10-05) : les cartes par pages de 24, chargées au défilement.
      page:
        more: "Afficher plus de fiches de cours"
      # UDR-0085 §3.2 : le titre d'un groupe de l'élève (matière, nombre de fiches de cours sur toute la recherche).
      course_group_title:
        count:
          one: "1 fiche de cours"
          other: "%{count} fiches de cours"
        label:
          one: "%{material}, 1 fiche de cours, voir la matière"
          other: "%{material}, %{count} fiches de cours, voir la matière"
      course_card:
        open: "Ouvrir la fiche de cours"
        # Lot O5 : sur la carte d'une leçon (ordinateur), les fiches au-delà de 3 se révèlent sur place.
        more_essentials: "Voir les %{count} fiches"
        # UDR écrans élève §3.6 : la ligne entière est le lien ; la pastille dit « En cours », la coche verte « Terminée ».
        progress:
          started: "En cours"
          done: "Terminée"
      # Lot O5 : la ligne d'une fiche sur la carte d'une leçon (ordinateur) ; l'étiquette d'une lacune en attente.
      essential_row:
        review: "À revoir"
      show:
        page_title: "%{name}"
        back: "Cours"
        content_title: "Contenu de la fiche de cours"
        essentials_title: "Révisions de la leçon"
        empty: "Aucune fiche de révision pour cette fiche de cours."
        empty_description: "Les fiches de révision publiées de cette fiche de cours apparaîtront ici."
        # UDR page de la leçon (refonte-page-lecon) §3.9 : les deux sections « Fiche de révision » et « Prépare interros ».
        revision_title: "Fiche de révision"
        revision_more: "Voir plus"
        revision_less: "Voir moins"
        revision_shown: "Fiche de révision affichée en entier"
        revision_empty: "La fiche de révision arrive bientôt."
        prepare_title: "Prépare interros"
        prepare_intro: "Un exercice par notion, puis quatre sur toute la leçon."
        lesson_wide_title: "Toute la leçon"
        exercises_empty: "Les exercices arrivent bientôt."
        question_count:
          one: "%{count} question"
          other: "%{count} questions"
        due: "À rendre %{day}"
        due_today: "À rendre aujourd'hui"
        to_review: "À revoir"
        assign_targets_none: "Aucune de vos classes n'est en %{level}."
      role_actions:
        menu: "Actions sur la fiche de cours « %{name} »"
        edit: "Modifier"
        import_essentials: "Importer des fiches de révision"
