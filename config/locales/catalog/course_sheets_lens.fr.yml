# Fiche de cours (contenu-en-blocs, chantier 318), Lot E : libellés des figures de la fiche Lentilles
# (kinds/_lens_diagrams et ses sept figures fixes, kinds/_lens_simulator, kinds/_lens_construction).
# Fichier à part : course_sheets.fr.yml est partagé par les lots en parallèle ; les clés suivent les partials (lookup `.clé`).
# Les légendes des figures fixes passent par `sheet_text` : [[clé|mot]] ouvre le lexique du document, **gras**, *italique*.
fr:
  catalog:
    course_sheets:
      kinds:
        lens_diagrams:
          families:
            label: "Une lentille convergente et une lentille divergente, vues de profil et en symbole"
            profile: "vue de profil"
            symbol: "symbole"
            convergent_title: "Lentille [[convergente|convergente]]"
            convergent_points:
              - "Bords **minces**, centre épais."
              - "Elle rapproche les rayons lumineux : elle les fait converger."
              - "Un texte vu de près à travers elle paraît **plus grand** (effet loupe)."
            divergent_title: "Lentille [[divergente|divergente]]"
            divergent_points:
              - "Bords **épais**, centre mince."
              - "Elle écarte les rayons lumineux : elle les fait diverger."
              - "Un texte vu à travers elle paraît **plus petit**."
          vocabulary:
            label: "Une lentille convergente : l'axe optique, le centre O, les foyers F et F′ et la distance focale f"
            badge: "À retenir"
            axis: "axe optique"
            points:
              - "L'[[axe|axe optique]] est la droite perpendiculaire à la lentille qui passe par son centre."
              - "Le [[centre|centre optique]] **O** est le centre de la lentille."
              - "Les rayons parallèles à l'axe optique ressortent en passant tous par un même point : le [[foyer|foyer image]] **F′**. Le foyer objet **F** est son symétrique par rapport à O."
              - "La [[focale|distance focale]] est la distance **f = OF′**. Plus f est petite, plus la lentille est convergente."
          example:
            label: "Construction de l'image d'un objet AB placé à 6 cm d'une lentille de distance focale 2 cm, sur un quadrillage"
            steps:
              - "Je trace le rayon parallèle à l'axe : il ressort par F′."
              - "Je trace le rayon qui passe par O : il n'est pas dévié."
              - "Ils se croisent en B′. Je place A′ sur l'axe."
              - "Je mesure : **OA′ = 3 cm** et **A′B′ = 1 cm**."
              - "L'image est [[reelle|réelle]], renversée et deux fois plus petite que l'objet."
          eye:
            label: "Le modèle de l'œil réduit : un diaphragme, une lentille convergente et un écran"
            badge: "Le modèle de l'œil réduit"
            diaphragm: "diaphragme"
            diaphragm_eye: "(iris, pupille)"
            lens: "lentille"
            lens_eye: "(cristallin)"
            screen: "écran"
            screen_eye: "(rétine)"
            head_eye: "Dans l'œil"
            head_model: "Dans le modèle"
            rows:
              - [ "L'iris et la pupille", "un diaphragme" ]
              - [ "Le [[cristallin|cristallin]]", "une lentille convergente" ]
              - [ "La [[retine|rétine]]", "un écran" ]
            note: "Pour voir net, l'image doit se former sur la rétine. Le cristallin change de forme pour y parvenir : c'est l'[[accommodation|accommodation]]."
          ametropia:
            fix_html: "On corrige avec une lentille <b data-lens=\"%{lens}\">%{word}</b>."
            word_convergent: "convergente"
            word_divergent: "divergente"
            myopia_title: "[[myopie|Myopie]]"
            myopia_label: "Myopie : les rayons se croisent avant la rétine"
            myopia_text: "L'image se forme **avant** la rétine. On voit flou de loin."
            hyperopia_title: "[[hypermetropie|Hypermétropie]]"
            hyperopia_label: "Hypermétropie : les rayons se croiseraient après la rétine"
            hyperopia_text: "L'image se forme **après** la rétine. On voit flou de près."
            presbyopia_title: "[[presbytie|Presbytie]]"
            presbyopia_label: "Presbytie : les rayons se croiseraient après la rétine"
            presbyopia_text: "Avec l'âge, le cristallin accommode moins bien. On voit flou de près."
          profiles:
            label: "Quatre lentilles vues de profil"
            lens: "Lentille %{number}"
          focal:
            label: "Des rayons parallèles à l'axe traversent une lentille convergente et se croisent sur un quadrillage"
            scale: "1 carreau = 1 cm"
        lens_simulator:
          label: "Simulateur d'une lentille convergente : le point B, les foyers F et F′ se déplacent"
          point_b: "Point B, haut de l'objet"
          focus_f: "Foyer objet F"
          focus_fp: "Foyer image F′"
          oa_label: "Distance lentille → objet OA"
          f_label: "Distance focale f"
          oap_label: "Distance lentille → image OA′"
          size_label: "Taille objet AB / image A′B′"
          nature_label: "Image"
          ray_1: "rayon 1"
          ray_2: "rayon 2"
          ray_3: "rayon 3"
          dashed: "pointillés : prolongements"
          preset_photo: "Appareil photo"
          preset_projector: "Projecteur"
          preset_magnifier: "Loupe"
          js:
            cm: "%{value} cm"
            none_value: "—"
            grid_hide: "Masquer la grille"
            grid_show: "Afficher la grille"
            application_photo: "Application : appareil photo"
            application_projector: "Application : projecteur"
            application_magnifier: "Application : loupe"
            application_none: "Application : aucune, il n'y a pas d'image nette"
            nature_real: "réelle, renversée, %{size}"
            nature_virtual: "virtuelle, droite, agrandie"
            nature_none: "pas d'image nette"
            size_bigger: "plus grande"
            size_smaller: "plus petite"
            size_same: "même taille"
            oap_real: "%{value} cm, après la lentille"
            oap_virtual: "%{value} cm, du côté de l'objet"
            oap_infinite: "à l'infini"
            status_real: "L'objet est plus loin que F. L'image est réelle : elle se forme après la lentille, à l'envers, et on peut la voir sur un écran."
            status_virtual: "L'objet est entre F et la lentille. L'image est virtuelle : on ne peut pas la recueillir sur un écran, mais on la voit en regardant à travers la lentille. C'est l'effet loupe."
            status_far: "L'image est trop loin pour être dessinée : elle se forme à plus de 40 cm de la lentille. Rapproche l'objet du foyer F pour la voir."
            status_none: "L'objet est au foyer F : les rayons ressortent parallèles entre eux. Ils ne se croisent jamais, il n'y a pas d'image nette."
        lens_construction:
          label: "Entraînement : place le point B′, image du point B par la lentille, sur le quadrillage"
          badge: "Entraînement illimité · Place l'image"
          marker: "Point B′, l'image de B : glisse-le ou déplace-le avec les flèches"
          js:
            prompt: "Lentille convergente, f = %{f} cm. L'objet AB mesure %{h} cm et se trouve à %{d} cm de la lentille. Fais glisser le point B′ à l'endroit où se forme l'image de B. (1 carreau = 1 cm)"
            wrong: "Pas tout à fait. Trace deux rayons particuliers depuis B : B′ est à leur croisement (ou à celui de leurs prolongements)."
            right_start: "Bravo !"
            right_real: "L'image est réelle et renversée, A′B′ = %{size} cm."
            right_virtual: "L'image est virtuelle et droite, A′B′ = %{size} cm."
            solution_hide: "Masquer la solution"
