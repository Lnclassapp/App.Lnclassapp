fr:
  # Écran d'import (ADR-0110, #318) : le type « fiche de cours en blocs », nommé comme le reste de l'écran. Le nom à l'écran
  # attend le porteur (Lot H) : seule cette valeur change.
  import_kinds:
    course_sheet: "Contenu de fiche de cours"
  teams:
    imports:
      new:
        page_titles:
          course_sheet: "Importer le contenu d'une fiche de cours"
      show:
        page_titles:
          course_sheet: "Import du contenu d'une fiche de cours"
  activemodel:
    attributes:
      dtos/catalog/import_upload_input:
        kind: "Type d'import"
        files: "Fichiers"
    errors:
      models:
        dtos/catalog/import_upload_input:
          attributes:
            kind:
              already_running: "Un import de ce type est déjà en cours."
            # ADR-0068 : un envoi de plusieurs fichiers, contrôlé fichier par fichier puis en tout. Phrases complètes :
            # l'écran les affiche sans le nom de l'attribut.
            files:
              blank: "Choisissez au moins un fichier .json."
              too_many: "Vous avez choisi %{value} fichiers : %{count} au plus."
              not_json: "« %{filename} » n'est pas un fichier .json."
              too_large: "« %{filename} » dépasse %{count} Mo."
              total_too_large: "Les fichiers font %{value} Mo au total : %{count} Mo au plus."
