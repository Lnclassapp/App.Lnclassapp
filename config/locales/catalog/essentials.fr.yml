# Page d'une fiche essentielle (plan boucle-pedagogique, Lot B3 ; reorganisation-equipe-enseignant, Lot F) — ADR-0028, ADR-0033,
# ADR-0043, UDR-0007, UDR-0015, UDR-0069 §3.8
fr:
  catalog:
    essentials:
      show:
        page_title: "%{name}"
        eyebrow: "Fiche de révision · %{course}"
        # UDR-0015, amendement du 2026-10-02 : l'élève lit le cours dans le retour ; le surtitre ne le redit pas.
        student_eyebrow: "Fiche de révision"
        team_actions: "Actions de l'équipe"
        edit: "Modifier"
        actions: "Actions pour %{name}"
        new_exercise: "Nouvel exercice"
        import_exercises: "Importer des exercices"
        no_content: "Cette fiche de révision n'a pas encore de contenu."
        # UDR écrans élève §3.4 : l'étiquette sous le titre, à côté des puces matière et classe.
        gap_since: "À revoir depuis le %{date}"
        gap_date_format: "%-d %b"
        exercises_title: "Exercices"
        exercises_count:
          zero: "Aucun exercice"
          one: "1 exercice"
          other: "%{count} exercices"
        empty_title: "Aucun exercice publié pour cette fiche de révision."
        empty_description: "Les exercices de cette fiche de révision apparaîtront ici dès leur publication."
        team_empty_title: "Aucun exercice pour cette fiche de révision."
        team_empty_description: "Créez un exercice ou importez-en : chacun naît en brouillon, à publier ensuite."
        # UDR-0069 §3.8 : l'enseignant sans classe au niveau du cours ; level : « Tle D », « 3ème ».
        assign_targets_none: "Aucune de vos classes n'est en %{level}."
      exercise_progress:
        assigned: "Assigné par ton enseignant"
        exercise_types:
          fixation: "Fixation"
          evaluation: "Évaluation"
        questions:
          zero: "Aucune question"
          one: "1 question"
          other: "%{count} questions"
        start: "Commencer"
        start_label: "Commencer l'exercice « %{title} »"
        # UDR-0015, amendement du 2026-10-06 : un exercice déjà terminé.
        redo: "Refaire"
        redo_label: "Refaire l'exercice « %{title} »"
        resume: "Reprendre"
        resume_label: "Reprendre l'exercice « %{title} »"
        open: "Voir l'exercice"
        open_label: "Voir l'exercice « %{title} »"
        assign_targets: "Assigner « %{title} » à vos classes"
