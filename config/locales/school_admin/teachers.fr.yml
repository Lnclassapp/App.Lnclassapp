      removal:
        title: "Retirer %{name} de l'établissement ?"
        body: "%{first_name} ne verra plus l'établissement ni ses classes. Ses devoirs encore actifs seront archivés : les élèves ne les verront plus à faire. Les classes, les élèves et leurs résultats restent. Vous pourrez le réintégrer depuis « Enseignants retirés »."
