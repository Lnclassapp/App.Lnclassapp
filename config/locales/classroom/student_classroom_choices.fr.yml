# « Choisis ta classe » : l'élève sans classe active (classe archivée, ou retiré) choisit la sienne par la cascade de l'inscription — ADR-0040, ADR-0085, UDR-0081 (§3.4, §3.5)
# « Changer de classe » (ADR-0095, UDR-0102) partage ces refus et marque la classe actuelle dans la cascade.
# Le code de classe (ADR code-de-classe-a-six-caracteres) : son refus « inconnu » est ici, commun à l'inscription et à « Choisis ta classe ».
fr:
  activemodel:
    errors:
      models:
        dtos/classroom/student_registration_input:
          attributes:
            base:
              # ADR-0085 §4.3 : l'élève retiré ne revient pas par la voie standard, seulement par le lien. Jamais dit à
              # l'inscription, où un compte qui naît n'a été retiré de rien.
              removed_from_classroom: "Tu ne peux pas rejoindre cette classe. Demande son lien à ton enseignant."
              # ADR-0095 §4.1 : refus de ChangeClassroom.
              same_classroom: "Tu es déjà dans cette classe."
              no_active_classroom: "Tu n'as pas de classe à quitter. Choisis ta classe."
              # Course entre deux classes (deux onglets) : rien n'a changé, l'élève réessaie.
              change_conflict: "Ton changement n'a pas pu se faire. Réessaie."
            join_code:
              # ADR code-de-classe §4.4 : même texte pour un code inexistant, mal tapé ou d'une classe archivée (CA-B3).
              unknown: "Ce code ne correspond à aucune classe. Vérifie-le, ou demande-le à ton enseignant."
  classroom:
    student_registrations:
      class_picker:
        # UDR-0102 §3.1 : la case de la classe actuelle, désactivée.
        current: "Ta classe"
    student_classroom_choices:
      new:
        page_title: "Choisis ta classe"
        title: "Choisis ta classe"
        link_invalid: "Ce lien n'est plus valable. Choisis ta classe."
        submit: "Rejoindre cette classe"
      create:
        welcome: "Bienvenue dans ta classe !"
