# Page d'une classe, enseignant et équipe (CL-10, CL-04, ID-15) — UDR-0027, vocabulaire UDR-0007, finitions UDR-0054 ; « Cours assignés » retiré (ADR-0072, UDR-0062 §3.6)
# Exercices assignés et cours : UDR-0062 §3.4 ; page de classe, téléphone : UDR enseignant §3.5 (Lot I de mvp-teacher-student)
fr:
  classroom:
    classrooms:
      header:
        back: "Accueil"
        # UDR enseignant §3.5 : « CSMT · 2026-2027 » sous le titre (le sigle, sinon le nom de l'établissement).
        subtitle: "%{school} · %{year}"
        archived: "Classe archivée"
        # Le stream du retrait (classroom_students/destroy) relit encore cette clé ; la page n'affiche plus l'effectif ni le plafond.
        headcount:
          one: "%{count} / %{max} élève"
          other: "%{count} / %{max} élèves"
      # ADR-0085, UDR-0081 §3.6 : le lien de la classe remplace son code. Vu par l'enseignant, la direction et l'équipe.
      link:
        label: "Inscrire vos élèves"
        copy: "Copier le lien"
        copied: "Lien copié"
        copy_label: "Copier le lien de la classe"
        whatsapp: "Partager sur WhatsApp"
        whatsapp_message: "Rejoins la classe %{classroom} sur Lnclass : %{url}"
        hint: "Ils s'inscrivent avec le lien, classe déjà choisie."
        more_label: "Autres actions sur le lien"
        change: "Changer le lien"
        change_title: "Changer le lien de la classe ?"
        change_warning: "L'ancien lien ne marchera plus. Les élèves déjà inscrits ne sont pas touchés."
        cancel: "Annuler"
        changed: "Le lien de la classe a changé."
      roster:
        title:
          one: "%{count} élève"
          other: "%{count} élèves"
        search_label: "Chercher un élève"
        search_submit: "Filtrer"
        count:
          one: "%{count} élève"
          other: "%{count} élèves"
        # UDR-0108 §3.3 (ADR-0097 §4.7) : trente élèves, puis « Voir les 30 suivants ».
        count_partial: "%{shown} sur %{total}"
        # UDR enseignant §3.2, §3.5 : les puces « Tous · Bronze · Argent · Or · Diamant · Pas encore » (`badge=`) et la ligne d'élève.
        badges_label: "Élèves par badge"
        all: "Tous"
        empty_badge: "Aucun élève avec ce badge"
        done_of:
          one: "%{count} fait sur %{assigned}"
          other: "%{count} faits sur %{assigned}"
        late: "%{count} en retard"
        badge_grade: "%{badge} · %{grade}/20"
        more:
          one: "Voir le dernier"
          other: "Voir les %{count} suivants"
        no_match: "Aucun élève ne correspond"
        clear_search: "Effacer la recherche"
        last_score: "Dernier score"
        last_score_tip: "Score de la dernière session d'exercice terminée par l'élève, en pourcentage de bonnes réponses."
        no_score: "Aucune session terminée"
        see_result: "Voir le résultat"
        # UDR-0084 §3.7 (accueil-eleve, ADR-0089 §4.2) : les exercices terminés par l'élève sans qu'ils aient été donnés.
        self_practice: "Fait seul (7 j)"
        self_practice_tip: "Exercices terminés par l'élève sans qu'ils aient été donnés, sur les 7 derniers jours, aujourd'hui compris."
        self_practice_line: "Fait seul : %{count} cette semaine"
        # UDR-0079 §3.8 ter (memo Q23) : le numéro d'un élève est masqué pour tout lecteur de la classe.
        contact_masked: "Numéro masqué pour protéger les élèves"
        # ADR-0085 §4.4, §4.5, UDR-0081 §3.7 : nouveaux arrivés (7 jours), voie d'arrivée, retrait d'un élève. La liste de
        # l'enseignant n'a plus de menu ⋮ (UDR-0108) ; le menu et la confirmation restent lus par la page de la classe de la
        # direction (school_admin/classrooms/show).
        new: "Nouveau"
        new_count:
          one: "%{count} nouveau"
          other: "%{count} nouveaux"
        via:
          standard: "Inscrit seul"
          link: "Par le lien"
        actions_label: "Actions pour %{name}"
        remove: "Retirer de la classe"
        remove_title: "Retirer %{name} de la classe ?"
        remove_warning: "%{name} quittera cette classe. Son compte et son travail sont gardés. Il pourra revenir avec le lien de la classe."
        remove_confirm: "Retirer"
        cancel: "Annuler"
        removed: "%{name} a été retiré de la classe."
        empty_title: "Aucun élève inscrit"
        empty_description: "Partagez le lien de la classe : les premiers inscrits apparaîtront ici."
      # UDR enseignant §3.5 : le partiel n'est plus rendu sur la page ; ses textes restent avec lui.
      session_days:
        title: "Jours de séance"
        set_html: "Vos jours de séance : <strong class=\"font-medium\">%{days}</strong>"
        unset: "Jours de séance non renseignés : vos exercices n'auront pas de date limite."
        # UDR-0077 §3.4 : le menu ⋮ du bloc.
        menu: "Actions sur les jours de séance"
        edit: "Modifier les jours"
        fill: "Renseigner"
      assigned_exercises:
        title: "Exercices assignés"
        empty_title: "Aucun exercice assigné"
        empty_description: "Ouvrez une fiche de cours ci-dessous pour assigner un exercice à cette classe."
        pending: "%{count} pas encore"
      courses:
        title: "Fiches de cours"
        empty_title: "Aucune fiche de cours publiée pour cette classe"
        empty_description: "Les fiches de cours de vos matières pour ce niveau apparaîtront ici dès leur publication."
        # UDR-0127 §3.1 (ADR-0103) : une bande par matière, pour l'enseignant de plusieurs matières
        band_label: "Fiches de cours de %{material}"
        count:
          one: "%{count} fiche de cours"
          other: "%{count} fiches de cours"
        essentials:
          one: "%{count} fiche de révision"
          other: "%{count} fiches de révision"
      # UDR-0121 §3.1, ADR-0101 §4.4 : les fiches à revoir de la classe (AS-17) ; « 10/20 » = Grading.grade_on_20(PASS_THRESHOLD).
      gaps:
        title: "Fiches à revoir"
        subtitle: "Des élèves ont eu moins de %{grade}/20 sur ces fiches de révision et ne les ont pas encore levées."
        students:
          one: "1 élève"
          other: "%{count} élèves"
