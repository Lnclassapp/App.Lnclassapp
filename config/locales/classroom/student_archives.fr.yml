# « Mon historique » de l'élève, même sans classe active (fonctions-espace-eleve, lot R) — ADR-0036, memo Q19
# Redessiné (historique-eleve) : carte bleue du total, exercices par mois — UDR-0090
fr:
  classroom:
    student_archives:
      show:
        page_title: "Mon historique"
        title: "Mon historique"
        back: "Accueil"
        summary:
          count:
            one: "exercice terminé"
            other: "exercices terminés"
          none: "Aucun exercice terminé pour l'instant"
          note: "Ils restent ici, même si tu changes de classe."
        classrooms:
          title: "Mes classes"
          # UDR-0103 §3.2 : l'année scolaire passe dans le détail, sans coupure à son tiret ; la période et « Actuelle » à droite du nom.
          detail_html: "%{level} · %{school} · %{year}"
          current: "Actuelle"
          since: "depuis le %{date}"
          between: "du %{from} au %{to}"
          # « 12 oct. », « 15 sept. 2025 »
          day: "%-d %b"
          day_year: "%-d %b %Y"
          empty: "Aucune classe pour l'instant"
          empty_description: "Les classes que tu rejoins restent ici, même après les avoir quittées."
        results:
          title: "Mes exercices terminés"
          empty: "Aucun exercice terminé"
          empty_description: "Chaque exercice terminé reste ici avec sa note, même après avoir quitté ta classe."
      month:
        # « Octobre 2026 » : strftime traduit par rails-i18n, majuscule posée par la vue.
        format: "%B %Y"
      result_row:
        # « 14 oct. »
        date_format: "%-d %b"
        detail: "%{material} · %{date}"
        grade_spoken: "%{grade} sur 20"
