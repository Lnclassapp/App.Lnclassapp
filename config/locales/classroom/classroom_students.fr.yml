# La fiche d'un élève dans sa classe (CL-13, AS-24 ; ADR-0097, UDR-0107 §3.10) — écran enseignant et équipe.
# Une clé par partial de classroom/classroom_students (lecture paresseuse t(".clé")). « session », jamais « essai » (UDR-0007).
fr:
  date:
    formats:
      arrived: "%-d %b"
  classroom:
    classroom_students:
      show:
        title: "%{name} · %{classroom}"
      # UDR enseignant §3.6 : « Numéro 07 •• •• •• 56 · Arrivé·e le 12 oct. » ; la classe est dans le lien de retour.
      identity:
        contact: "Numéro"
        contact_masked: "Numéro masqué pour protéger les élèves"
        arrived: "Arrivé·e le %{date}"
      # UDR enseignant §3.2, §3.6 : « 9 faits sur 18 » + « 1 en retard », « Moyenne 14/20 · Or », puis les badges obtenus.
      summary:
        done_of:
          one: "%{count} fait sur %{assigned}"
          other: "%{count} faits sur %{assigned}"
        late: "%{count} en retard"
        average: "Moyenne %{grade}/20 · %{badge}"
        badges_label: "Badges obtenus dans cette classe"
      assignments:
        title: "Exercices de la classe"
        empty:
          title: "Aucun exercice assigné à la classe."
          description: "Les exercices que vous assignez apparaîtront ici."
        done_on: "Fait le %{date}"
        late_on: "Rendu en retard le %{date}"
        not_done: "Pas encore fait"
        overdue: "En retard"
        sessions:
          one: "%{count} session"
          other: "%{count} sessions"
        best_session: "Voir la meilleure session"
      self_practice:
        title: "Fait seul · %{days} derniers jours"
        hint: "Exercices faits sans qu'on les lui ait assignés."
        truncated: "Les %{shown} plus récents sur %{total}."
        empty: "Aucun exercice fait seul ces %{days} derniers jours."
        see_result: "Voir le résultat"
      # UDR-0107 §3.6 (memo Q4) : les actions quittent le menu ⋮ de la ligne de la liste pour la fiche.
      manage:
        title: "Gérer"
        issue_code: "Code de récupération"
        issue_code_hint: "Un élève qui a perdu son code secret le réinitialise avec un code de récupération, valable 15 minutes."
        remove: "Retirer de la classe"
        remove_title: "Retirer %{name} de la classe ?"
        remove_warning: "%{name} quittera cette classe. Son compte et son travail sont gardés. Il pourra revenir avec le lien de la classe."
        cancel: "Annuler"
        remove_confirm: "Retirer"
