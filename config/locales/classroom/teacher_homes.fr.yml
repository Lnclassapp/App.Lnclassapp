# Accueil enseignant (plan boucle-pedagogique, Lot D3, TR-05 ; reorganisation-equipe-enseignant, Lot D ;
# interface-enseignant-organisation, Lot A ; inscription-enseignant, Lot B ; mvp-teacher-student, Lot G) — UDR-0007, UDR-0026,
# UDR-0069, UDR-0077, UDR-0079, UDR enseignant (§3.3 accueil, §3.13 accueil sans classe)
fr:
  classroom:
    teacher_homes:
      show:
        page_title: "Accueil"
        classrooms_title: "Mes classes"
        courses_title: "Fiches de cours"
      # UDR enseignant §3.3 : « Cette semaine » ; le titre ne se lit que par les lecteurs d'écran.
      follow_ups:
        title: "Cette semaine"
        empty: "Aucun exercice à suivre cette semaine."
        due: "%{classroom} · à rendre %{date}"
        no_due: "%{classroom} · sans date limite"
        done:
          one: "%{done} / %{count} fait"
          other: "%{done} / %{count} faits"
        pending: "%{count} pas encore"
        late: "%{count} en retard"
      # UDR enseignant §3.3 : « Historique », absent sans ligne ; moyenne de la classe à droite.
      history:
        title: "Historique"
        today: "Aujourd'hui"
        yesterday: "Hier"
        line: "%{classroom} · %{done}"
        average: "%{grade}/20"
        average_label: "Moyenne de la classe : %{grade} sur 20"
      choose_materials:
        title: "Choisissez vos matières"
        description: "Vos cours et vos exercices à suivre dépendent des matières que vous enseignez dans cet établissement."
        action: "Choisir mes matières"
      course_levels:
        label: "Vos niveaux et actions"
        empty: "Déclarez vos classes pour retrouver ici les fiches de cours de vos niveaux."
        sr_level: ", fiches de cours de %{material}"
        sr_level_many: ", fiches de cours de vos matières"
        invite: "Inviter"
        # UDR-0079 §3.7 : la bulle ouvre WhatsApp ; l'espace en tête sépare le suffixe du libellé lu « Inviter ».
        invite_sr: " sur WhatsApp"
      # UDR enseignant §3.3 : la carte d'une classe ; l'en-tête se lit « Tle D 1 · CSMT ».
      classroom_card:
        header: "%{classroom} · %{school}"
        header_label: "Ouvrir la classe %{classroom}"
        students:
          zero: "Aucun élève"
          one: "1 élève"
          other: "%{count} élèves"
        assignments:
          zero: "Aucun exercice en cours"
          one: "1 exercice en cours"
          other: "%{count} exercices en cours"
        empty_hint: "Donnez-leur le code, ou partagez le lien sur WhatsApp."
        badges_label: "Élèves par badge"
        code_label: "Code de la classe"
        copy: "Copier"
        copy_label: "Copier le code de la classe %{classroom}"
        copied: "Code copié."
      # UDR enseignant §3.3, §3.13 : la dernière carte du carrousel, et la carte du haut d'un accueil sans classe.
      add_classroom_card:
        action: "+ Ajouter une classe"
        empty_title: "Ajoutez vos classes"
        empty_description: "Cochez les classes où vous enseignez : chacune reçoit un code à donner à vos élèves."
      pending_colleagues:
        title: "Collègues en attente"
        subtitle: "Ils se sont inscrits à %{school} sans code. Confirmez seulement ceux que vous connaissez."
        requested_on: "Demande du %{date}"
        vouch: "Je confirme"
        vouch_label: "Confirmer que %{name} enseigne à %{school}"
