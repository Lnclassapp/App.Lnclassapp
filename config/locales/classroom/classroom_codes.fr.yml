# Vérification d'un code de classe : aperçu en Turbo Frame, trouvée / inconnue / trop d'essais — ADR code-de-classe-a-six-caracteres (§4.4, §4.5), UDR-0081
fr:
  classroom:
    classroom_codes:
      show:
        label: "Ta classe"
        level: "Niveau : %{level}"
        full: "Cette classe est complète."
        # Même texte pour un code inexistant, mal tapé ou d'une classe archivée : la page ne dit pas lequel (CA-B3).
        unknown: "Ce code ne correspond à aucune classe. Vérifie-le avec ton enseignant."
        # L'ADR dit « Trop d'essais » ; « essai » est interdit à l'écran (UDR-0007, locale_files_test) : même sens, « tentatives », comme /c/<jeton>.
        rate_limited: "Trop de tentatives. Attends une minute, ou coche « Je n'ai pas de code »."
