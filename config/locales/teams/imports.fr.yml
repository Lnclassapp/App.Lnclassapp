# Écran des imports de l'équipe (plan boucle-pedagogique, 0e.e4) — ADR-0039, UDR-0007
fr:
  teams:
    imports:
      statuses:
        queued: "En file d'attente"
        validating: "Vérification"
        importing: "Import en cours"
        completed: "Terminé"
        rejected: "Rejeté"
        failed: "Échoué"
      error_codes:
        json_invalid: "Le fichier n'est pas un JSON lisible."
        format_mismatch: "Le format du fichier ne correspond pas à ce type d'import (attendu : %{expected})."
        format_of_other_kind: "Ce fichier est un import « %{received_kind} » (format %{received}), pas un import « %{expected_kind} » (format %{expected}) : téléversez-le depuis l'import « %{received_kind} »."
        version_unsupported: "Cette version du format n'est pas prise en charge (attendue : %{expected})."
        unknown_target: "La cible indiquée est introuvable."
        too_many_roots: "Le fichier contient %{count} éléments ; %{max} au plus."
        too_large: "Le fichier est trop volumineux."
        schema: "Valeur non conforme au format attendu."
        blank: "Valeur obligatoire manquante."
        too_long: "Valeur trop longue."
        unknown_level: "Niveau inconnu."
        unknown_series: "Série inconnue."
        unknown_material: "Matière inconnue."
        unknown_drena: "DRENA inconnue."
        series_not_allowed: "Cette série n'est pas proposée pour ce niveau."
        invalid_value: "Valeur non valide."
        national_code_taken: "Ce code national est déjà celui d'un autre établissement."
        question_structure: "Question incomplète : vérifiez ses propositions et la bonne réponse."
        write_failed: "L'enregistrement de cet élément n'a pas abouti."
        taken: "Ce nom est déjà pris par une autre DRENA."
        no_latin_character: "Le nom doit contenir au moins une lettre ou un chiffre latin."
        duplicate_in_files: "Ce cours est aussi dans %{other} : aucun des deux n'est importé."
