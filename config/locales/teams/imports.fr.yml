        files_summary:
          one: "1 fichier · %{size}"
          other: "%{count} fichiers · %{size}"
          kilobytes: "%{size} Ko"
          megabytes: "%{size} Mo"
          too_many_files: "Vous avez choisi %{count} fichiers : %{max} au plus."
          not_json: "« %{name} » n'est pas un fichier .json."
          file_too_large: "« %{name} » dépasse %{max} Mo."
          total_too_large: "Les fichiers font %{size} au total : %{max} Mo au plus."
        submit: "Lancer l'import"
        cancel: "Annuler"
      create:
        started: "Import lancé."
        tracking_title: "Import : %{kind}"
        close: "Fermer"
      show:
        # Titre de l'onglet (UDR-0054 §3.1) : un seul segment, sans deux-points.
        page_titles:
          schools: "Import d'établissements"
          course_tree: "Import de cours complets"
          essentials: "Import de fiches essentielles"
          exercises: "Import d'exercices"
          drenas: "Import de DRENA"
        title: "Import : %{kind}"
        subtitle: "%{filename} · %{author} · %{date}"
        back: "Imports"
      status:
        finished_at: "Fini le %{time}"
        processed:
          one: "%{count} élément vérifié"
          other: "%{count} éléments vérifiés"
        phases:
          queued: "Le fichier attend son tour."
          validating: "Vérification de tout le fichier…"
          importing: "Écriture des éléments valides…"
        counters:
          imported: "Importés"
          skipped: "Ignorés (doublons)"
          errors: "En erreur"
          total: "Total"
        details_title: "Détails"
        details:
          classrooms: "Classes générées"
        rejected: "Le fichier a été rejeté en bloc : rien n'a été écrit. Corrigez le motif ci-dessous, puis relancez l'import."
        rejected_files: "Aucun fichier n'a pu être lu : rien n'a été écrit. Corrigez les motifs ci-dessous, puis relancez l'import."
        # Bilan par fichier (UDR-0055 §3.2).
        files_title: "Fichiers (%{count})"
        file_rejected: "Refusé"
        file_counts:
          imported:
            one: "%{count} importé"
            other: "%{count} importés"
          skipped:
            one: "%{count} ignoré"
            other: "%{count} ignorés"
          errors:
            one: "%{count} en erreur"
            other: "%{count} en erreur"
        failed: "L'import s'est arrêté sur une erreur imprévue. Relancé, le fichier comptera en doublons ce qui a déjà été écrit."
      import_errors:
        title: "Erreurs"
        more:
          one: "Et %{count} autre élément en erreur, non détaillé."
          other: "Et %{count} autres éléments en erreur, non détaillés."
