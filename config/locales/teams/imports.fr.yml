      schema_keywords:
        schema: "Clé inconnue : ce format ne la prévoit pas."
        required: "Clé obligatoire manquante."
        string: "Valeur attendue : un texte."
        integer: "Valeur attendue : un nombre entier."
        number: "Valeur attendue : un nombre."
        boolean: "Valeur attendue : vrai ou faux."
        array: "Valeur attendue : une liste."
        object: "Valeur attendue : un objet."
        const: "Valeur inattendue pour cette clé."
        maxLength: "Valeur trop longue."
      # Nom d'un import de plusieurs fichiers dans l'historique et l'en-tête du rapport (UDR-0055 §3.4).
      files_label:
        one: "%{first} et %{count} autre fichier"
        other: "%{first} et %{count} autres fichiers"
      index:
        page_title: "Imports"
        title: "Imports"
        subtitle: "DRENA, établissements, cours, fiches essentielles et exercices importés depuis un fichier JSON."
        new: "Nouvel import"
        all: "Tous"
        filter_label: "Filtrer par type d'import"
        empty_title: "Aucun import pour l'instant"
        empty_description: "Chaque fichier importé apparaîtra ici avec son bilan."
        columns:
          date: "Date"
          kind: "Type"
          file: "Fichier"
          status: "Statut"
          imported: "Importés"
          skipped: "Ignorés"
          errors: "En erreur"
          author: "Auteur"
      new:
        title: "Importer : %{kind}"
        # Titre de l'onglet (UDR-0054 §3.1) : un seul segment, sans deux-points.
        page_titles:
          schools: "Importer des établissements"
          course_tree: "Importer des cours complets"
          essentials: "Importer des fiches essentielles"
          exercises: "Importer des exercices"
          drenas: "Importer des DRENA"
        file: "Fichier JSON"
        limits: "Un fichier .json de %{megabytes} Mo au plus, avec %{roots} éléments au plus."
        files: "Fichiers JSON"
        limits_multiple: "Jusqu'à %{files} fichiers .json, %{total} Mo au total, %{megabytes} Mo au plus par fichier, %{roots} cours au plus en tout."
