# Directions retirées et restauration par l'équipe (chantier inscription-direction, Lot C) — ADR-0077, UDR-0070 §3.5 ;
# le bloc « Direction » et le retrait sont ceux de shared.school_staff
fr:
  teams:
    schools:
      archived_staff:
        title: "Directions retirées"
        # suites-inscription-direction : accordés au genre du compte retiré.
        line:
          male: "Retiré le %{date} par %{author}"
          female: "Retirée le %{date} par %{author}"
        due:
          male: "Supprimé le %{date}"
          female: "Supprimée le %{date}"
        restore: "Restaurer"
        restore_label: "Restaurer %{name}"
    school_staff_restorations:
      create:
        done: "%{name} est de nouveau dans la direction."
        cap_reached: "Les 3 places de direction par le code sont prises : retirez d'abord un compte."
        # ADR-0092 §4.3, UDR-0092 §3.4 : la restauration d'un ancien chef ne crée pas deux chefs.
        head_taken: "Cet établissement a déjà un chef d'établissement actif. Changez d'abord une fonction."
    # ADR-0092, UDR-0092 §3.4 : l'équipe change la fonction d'une direction, depuis la fiche de l'établissement.
    school_staff_positions:
      edit:
        title: "Fonction de %{name}"
        legend: "Fonction"
        cancel: "Annuler"
        submit: "Enregistrer"
        submitting: "Enregistrement…"
        back: "Retour à l'établissement"
      update:
        done: "La fonction de %{name} est enregistrée."
  activemodel:
    attributes:
      dtos/school/staff_position_input:
        position: "Fonction"
    errors:
      models:
        dtos/school/staff_position_input:
          attributes:
            position:
              blank: "Choisissez une fonction."
              head_taken: "Cet établissement a déjà un chef d'établissement actif."
