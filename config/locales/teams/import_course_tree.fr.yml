# Import des fiches de cours complètes, format 3 (refonte-contenus-maths, Lot A) — ADR-0035, ADR-0039, ADR-0113, ADR-XXXX, UDR-0038, UDR-0007
fr:
  teams:
    imports:
      kinds:
        course_tree:
          title: "Format du fichier"
          intro_html: "Un fichier JSON au format <code class=\"font-mono text-xs text-ink\">lnclass.course-tree</code>, version 3. Chaque élément de <code class=\"font-mono text-xs text-ink\">courses</code> est une fiche de cours avec toute sa descendance : figures, notions (chacune avec sa fiche de révision et son exercice), problèmes, questions et propositions. Une fiche de cours entre entière, ou pas du tout."
          exercise_rule: "Les règles de la fiche de cours : de 1 à 12 notions, chacune avec sa fiche (À retenir, La méthode, Un exemple corrigé, Le piège à éviter) et exactement un exercice ; quatre problèmes pour l'ensemble de la fiche de cours ; de 5 à 30 questions par exercice, chacune avec sa correction rédigée (de 20 à 2 000 caractères) ; l'exemple corrigé a autant d'étapes que La méthode. Une fiche de cours qui ne tient pas la règle est refusée entière, l'élément en cause nommé."
          legacy_version: "Les versions 1 et 2 du format sont retirées : un fichier à ces versions est refusé en entier, raison « format retiré »."
          multiple: "Vous pouvez choisir jusqu'à %{files} fichiers : ils forment un seul import, avec un bilan par fichier. Une même fiche de cours dans deux fichiers n'est importée dans aucun des deux."
          nodes:
            course: "Fiche de cours"
            figure: "Figure"
            notion: "Notion"
            exercise: "Exercice"
            question: "Question"
            answer: "Proposition"
          paths:
            course: "courses[]"
            figure: "figures[]"
            notion: "notions[]"
            exercise: "exercise · exercises[]"
            question: "questions[]"
            answer: "answers[]"
          keys:
            course:
              name: "Nom de la fiche de cours. Obligatoire, 200 caractères au plus."
              subtitle: "Sous-titre. Facultatif, 300 caractères au plus."
              level_name: "Niveau, par son nom ou son slug. Obligatoire."
              series_name: "Série, par son nom. Facultative ; donnée, elle doit être proposée pour ce niveau."
              material_name: "Matière, par son nom, son slug ou son abrégé. Obligatoire."
              theme: "Habillage du cahier : blue, teal ou burgundy. Facultatif ; blue sans la clé."
              figures: "Ses figures paramétrées, de 0 à 12, citées par leur clé."
              notions: "Ses notions, dans l'ordre. De 1 à 12."
              exercises: "Ses quatre problèmes portant sur l'ensemble de la fiche de cours, dans l'ordre. Exactement quatre."
            figure:
              key: "Clé de la figure, unique dans la fiche de cours : minuscules, chiffres et tirets, 40 caractères au plus."
              kind: "Sorte : geometry, coordinate_plane, number_line, stat_chart ou solid."
              description: "Description textuelle, lue sans JavaScript. Obligatoire, de 150 à 600 caractères."
              params: "Paramètres de la sorte, bornés. Un paramètre inconnu ou hors bornes refuse la fiche de cours."
              controls: "Curseurs de la figure, de 0 à 4 : param, min, max, step, label."
            notion:
              name: "Nom de la notion. Obligatoire, 150 caractères au plus, unique dans la fiche de cours."
              remember: "À retenir. Obligatoire, 1 200 caractères au plus."
              method: "La méthode : de 2 à 8 étapes de 300 caractères au plus."
              example: "Un exemple corrigé : statement (l'énoncé) et steps, autant d'étapes que La méthode, l'étape n appliquant l'étape n."
              pitfall: "Le piège à éviter. Obligatoire, 1 200 caractères au plus."
              figure: "Clé d'une figure de la fiche de cours. Facultative."
              exercise: "Son exercice. Exactement un par notion."
            exercise:
              title: "Titre de l'exercice. Obligatoire, 150 caractères au plus."
              statement: "Sujet de l'exercice : le texte que l'élève lit avant ses questions. Obligatoire."
              exercise_type: "fixation ou evaluation. Obligatoire."
              figure: "Clé d'une figure de la fiche de cours, rendue sous le sujet. Facultative."
              questions: "Ses questions, dans l'ordre. De 5 à 30."
            question:
              content: "Énoncé. Obligatoire."
              question_type: "true_false, single_choice, multiple_correct_2, multiple_correct_3, fill_blank, numeric, ordering ou matching. Vrai/Faux : 2 propositions dont 1 correcte ; choix : 1, 2 ou 3 correctes, et au moins une incorrecte en plus. Les quatre derniers : voir les exemples ci-dessous."
              explanation: "Correction rédigée, qui reprend les étapes de La méthode. Obligatoire pour toute question, de 20 à 2 000 caractères."
              tolerance: "numeric seulement : la marge acceptée autour de la valeur (0.1). Facultative : sans elle, seule la valeur exacte est juste."
              answers: "Ses propositions, dans l'ordre."
            answer:
              content: "Texte de la proposition. Obligatoire, 500 caractères au plus."
              correct: "true si la proposition est correcte ; false par défaut. Inutile hors choix : chaque élément y est juste."
              match: "matching seulement : le côté droit de la paire, content étant le côté gauche. 500 caractères au plus."
          example: "Exemple minimal"
          example_hint: "Les points de suspension et les lignes commençant par // marquent ce qu'il reste à écrire : un fichier JSON ne contient ni les uns ni les autres. Il faut quatre problèmes pour l'ensemble de la fiche de cours et cinq questions au moins par exercice, chacune avec sa correction rédigée."
          drafts: "Tout arrive en brouillon : relisez, puis publiez. Une fiche de cours déjà présente (même nom, niveau, matière et série, sans tenir compte des accents, de la casse ni des espaces) et encore en brouillon est remplacée entière, avec la même adresse ; ses séances de l'équipe sont supprimées. Une fiche de cours publiée ou archivée est refusée, rien n'est modifié. Plafonds : 12 notions et 12 figures par fiche de cours, 30 questions par exercice, 10 propositions par question, 5 000 caractères par sujet."
          referential: "Noms acceptés du référentiel"
          referential_hint: "Les noms sont comparés sans accents ni casse : « Physique Chimie » désigne Physique-Chimie. Un nom inconnu met la fiche de cours en erreur ; rien n'est créé dans le référentiel."
          levels: "Niveaux et leurs séries"
          no_series: "sans série"
          materials: "Matières et leur abrégé"
          no_referential: "Le référentiel est vide : créez les niveaux, les séries et les matières avant d'importer des fiches de cours."
          no_referential_link: "Ouvrir le référentiel"
      status:
        details:
          essentials_created: "Fiches de révision créées"
          exercises_created: "Exercices créés"
          exercises_archived: "Exercices archivés (fiche de cours réimportée)"
          exercises_ignored_v1: "Exercices ignorés (format v1)"
          questions_created: "Questions créées"
          answers_created: "Propositions créées"
