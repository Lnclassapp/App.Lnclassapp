# Images des questions (chantier images-dans-les-cours) — ADR-0105, UDR-0129. Les images de fiches de révision sont retirées (ADR-XXXX §4.5).
fr:
  activemodel:
    attributes:
      dtos/shared/content_image_input:
        file: "Image"
    errors:
      models:
        # Mêmes raisons côté serveur et côté navigateur (UDR-0129 §3.1, image_messages).
        dtos/shared/content_image_input:
          attributes:
            file:
              blank: "Choisissez une image."
              content_type: "Ce format n'est pas accepté : JPEG, PNG ou WebP fixe seulement."
              too_heavy: "L'image dépasse %{count} Ko, même allégée."
              too_large: "L'image dépasse %{count} pixels de côté."
              unreadable: "Ce fichier n'est pas une image lisible."
              too_many: "%{count} images au plus par fiche de révision."
  teams:
    exercises:
      question_fields:
        image_messages:
          refused: "L'image n'a pas été ajoutée. %{reason}"
          format: "Ce format n'est pas accepté : JPEG, PNG ou WebP fixe seulement."
          too_heavy: "L'image dépasse %{max_bytes}, même allégée."
          forbidden: "Vous ne pouvez pas ajouter d'image à une question."
          failed: "L'envoi a échoué. Vérifiez votre connexion, puis réessayez."
          expired: "Votre session a expiré. Reconnectez-vous dans un autre onglet, puis réessayez."
          uploading: "Envoi de l'image en cours…"
          waiting: "Envoi de l'image en cours : l'exercice s'enregistrera ensuite."
          not_saved: "L'exercice n'est pas enregistré : une image n'a pas pu être ajoutée. Retirez-la ou renvoyez-la, puis enregistrez de nouveau."
      transition:
        refusals:
          image_missing: "La question %{number} attend son image."
          image_alt_blank: "L'image de la question %{number} n'a pas de texte de remplacement."
