        submit: "Enregistrer"
        cancel: "Annuler"
        refused_title: "Publication impossible"
        refused_body: "L'article reste dans son état. Complétez ce qui est signalé, enregistrez, puis publiez depuis le menu ⋮."
      form:
        title_placeholder: "Ex. : Réviser le BEPC en 4 semaines"
        title_hint_new: "%{max} caractères au plus. L'adresse de l'article en est tirée une fois pour toutes."
        title_hint_edit: "%{max} caractères au plus. L'adresse reste %{path}, même si le titre change."
        excerpt_hint: "Une à deux phrases, %{max} caractères au plus : elles s'affichent dans la liste du blog et dans l'aperçu partagé."
        excerpt_count: "%{count} / %{max}"
        excerpt_near: "Il reste %{count} caractères."
        excerpt_full: "Limite atteinte : %{max} caractères."
        cover_legend: "Image de couverture (facultative)"
        cover_placeholder: "Aucune couverture : le partage utilisera l'image par défaut de Lnclass."
        cover_file_label: "Choisir une image"
        cover_hint: "JPEG, PNG ou WebP, allégée avant l'envoi : %{max_side} pixels de côté et %{max_bytes} au plus."
        cover_remove: "Retirer la couverture"
        cover_alt_hint: "Décrivez ce que montre l'image, pour qui ne la voit pas. Obligatoire pour publier avec une couverture."
        body_placeholder: "Écrivez l'article…"
        body_hint: "Glissez, collez ou insérez jusqu'à %{max_count} images, de %{max_bytes} chacune au plus après allègement."
        insert_image: "Insérer une image"
        images_title: "Images du texte"
        images_intro: "Décrivez chaque image pour qui ne la voit pas : ce texte est obligatoire pour publier."
        image_alt_label: "Texte de remplacement de l'image"
        image_alt_hint: "Ce que montre l'image, en une phrase."
        image_alt_missing: "À compléter"
        signature_label: "Signature"
        signature_team: "L'équipe Lnclass"
        signature_author: "%{name}"
        signature_hint: "Si le compte de l'auteur est désactivé, l'article sera signé « L'équipe Lnclass »."
        # Messages du navigateur (éditeur, couverture) ; %{name}, %{reason} et %{number} sont remplacés par le contrôleur
        # Stimulus, %{max_bytes} et %{max_count} par Communication::ArticleFormHelper (UDR-0065 §3.4.3, §3.4.4).
        image_messages:
          refused: "« %{name} » n'a pas été ajoutée. %{reason}"
          format: "Ce format n'est pas accepté : JPEG, PNG ou WebP fixe seulement."
          too_heavy: "L'image dépasse %{max_bytes}, même allégée."
          too_many: "L'article a déjà %{max_count} images dans son texte."
          web_image: "Une image copiée d'une autre page web n'est pas acceptée : enregistrez-la, puis insérez-la."
          forbidden: "Vous ne pouvez pas ajouter d'image à un article."
          failed: "L'envoi a échoué. Vérifiez votre connexion, puis réessayez."
          uploading: "Envoi de l'image en cours…"
          uploaded: "Image %{number} ajoutée. Saisissez son texte de remplacement sous l'éditeur."
          waiting: "Envoi des images en cours : l'article s'enregistrera ensuite."
          not_saved: "L'article n'est pas enregistré : une image n'a pas pu être ajoutée. Retirez-la ou renvoyez-la, puis enregistrez de nouveau."
      create:
        created: "Article « %{title} » créé (brouillon)."
      update:
        updated: "Article « %{title} » enregistré."
        updated_live: "« %{title} » est enregistré : vos modifications sont en ligne."
      transition:
        published: "« %{title} » est publié : il est en ligne sur le blog."
        republished: "« %{title} » est de nouveau en ligne, à la même adresse."
        archived: "« %{title} » est archivé : son lien affiche « Cet article n'est plus disponible ». Vous pouvez le remettre en ligne."
        conflict: "« %{title} » a déjà changé d'état : la ligne montre son état actuel."
      publish:
        refused_fallback: "Publication impossible : complétez l'article."
