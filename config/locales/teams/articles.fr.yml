# Gestion du blog par l'équipe (UDR-0065 §3.8) — ADR-0073. Vouvoiement ; « article », « brouillon », « publié »,
# « archivé », « remettre en ligne », « texte de remplacement », « couverture » ; jamais « post », « billet », « alt ».
fr:
  activemodel:
    attributes:
      dtos/communication/article_input:
        title: "Titre"
        excerpt: "Résumé"
        body: "Texte"
        cover_public_id: "Image de couverture"
        cover_alt: "Texte de remplacement de la couverture"
        signature: "Signature"
        image_alts: "Textes de remplacement"
      dtos/communication/article_image_input:
        file: "Image"
    errors:
      models:
        # Messages de la saisie, et de la règle de complétude de Entities::Communication::Article, qui les lit ici
        # (publication, enregistrement d'un article publié : UDR-0065 §3.3, §3.5).
        dtos/communication/article_input:
          # Erreurs posées sur « image_alts.<public_id> » : une image du texte n'a pas de clé d'attribut propre.
          image_alt_blank: "Saisissez le texte de remplacement de l'image %{number} : il est obligatoire pour publier."
          too_long: "Le texte de remplacement dépasse %{count} caractères."
          attributes:
            title:
              blank: "Indiquez le titre de l'article."
              too_long: "Le titre dépasse %{count} caractères."
            excerpt:
              blank: "Écrivez le résumé : il est obligatoire pour publier."
              too_long: "Le résumé dépasse %{count} caractères."
            body:
              blank: "Écrivez le texte de l'article : il est obligatoire pour publier."
              too_long: "Le texte dépasse %{count} caractères : raccourcissez-le."
              too_many_images: "Un article compte au plus %{count} images dans son texte : retirez-en une."
            cover_public_id:
              invalid: "Cette image de couverture n'est plus disponible : choisissez-la de nouveau."
            cover_alt:
              blank: "Décrivez la couverture : son texte de remplacement est obligatoire pour publier."
              too_long: "Le texte de remplacement dépasse %{count} caractères."
            signature:
              inclusion: "Choisissez une signature."
            status:
              inclusion: "Cet état d'article n'existe pas."
        # Mêmes raisons côté serveur et côté navigateur (UDR-0065 §3.4.3, form.image_messages).
        dtos/communication/article_image_input:
          attributes:
            file:
              blank: "Choisissez une image."
              content_type: "Ce format n'est pas accepté : JPEG, PNG ou WebP fixe seulement."
              too_heavy: "L'image dépasse %{count} Mo, même allégée."
              too_large: "L'image dépasse %{count} pixels de côté."
              unreadable: "Ce fichier n'est pas une image lisible."
              too_many: "L'article a déjà %{count} images dans son texte."
  teams:
    articles:
      index:
        page_title: "Blog"
        title: "Blog"
        subtitle: "Les articles publics de Lnclass, du brouillon à l'archive."
        back: "Accueil"
        new_article: "Nouvel article"
        total:
          one: "%{count} article"
          other: "%{count} articles"
        caption: "Articles du blog, du plus récemment modifié au plus ancien"
        columns:
          article: "Article"
          status: "État"
          date: "Date"
          reads: "Lectures"
          reads_note: "sans dédoublonnage"
          actions: "Actions"
        reads_tip: "Ouvertures de l'article publié, hors équipe, aperçus et robots déclarés. Sans cookie, un lecteur qui revient compte deux fois."
        empty_title: "Aucun article pour l'instant"
        empty_description: "Écrivez le premier : il reste en brouillon jusqu'à sa publication."
      article_row:
        actions: "Actions pour « %{title} »"
        written_by: "Écrit par %{author}"
        signed_team: "signé « L'équipe Lnclass »"
        signed_author: "signé de son nom"
        published_on: "Publié le %{date}"
        archived_on: "Archivé le %{date}"
        updated_on: "Modifié le %{date}"
        never_published: "Jamais publié"
      # Badge d'état (Communication::ArticleStatusHelper), le même dans la liste, la modale et le bandeau d'aperçu.
      status:
        draft: "Brouillon"
        published: "Publié"
        archived: "Archivé"
      # Entrées du menu ⋮ d'une ligne (Communication::ArticleStatusHelper#article_menu_items).
      menu:
        edit: "Modifier"
        preview: "Aperçu"
        view: "Voir l'article"
        publish: "Publier"
        archive: "Archiver"
        republish: "Remettre en ligne"
      new:
        title: "Nouvel article"
        draft_notice: "L'article est créé en brouillon ; il se publie ensuite depuis le menu ⋮ de la liste."
        submit: "Créer le brouillon"
        cancel: "Annuler"
      edit_modal:
        title: "Modifier l'article"
        status_notice: "L'état se change depuis le menu ⋮ de la liste, jamais dans ce formulaire."
