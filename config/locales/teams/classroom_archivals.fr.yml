# ADR-0088, UDR-0083 : archivage d'une classe et d'un niveau depuis la fiche d'un établissement (équipe).
fr:
  teams:
    classroom_archivals:
      archive:
        done: "Classe « %{name} » archivée."
      restore:
        done: "Classe « %{name} » restaurée."
      undo: "Annuler"
      errors:
        forbidden: "Vous n'avez pas le droit d'archiver cette classe."
        not_found: "Cette classe est introuvable."
        already_archived: "Cette classe est déjà archivée."
        not_archived: "Cette classe n'est pas archivée."
    level_archivals:
