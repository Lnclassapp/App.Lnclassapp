        forbidden: "Vous n'avez pas le droit d'archiver ce niveau."
        not_found: "Ce niveau est introuvable."
        nothing_to_archive: "Ce niveau n'a aucune classe active à archiver."
    schools:
      classroom_group:
        empty: "Aucune classe"
        archived_count:
          one: "%{count} archivée"
          other: "%{count} archivées"
