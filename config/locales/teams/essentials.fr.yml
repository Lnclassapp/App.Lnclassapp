# Fiches essentielles, formulaire de l'équipe (plan boucle-pedagogique, Lot B4) — ADR-0035, UDR-0007, UDR-0016
fr:
  activemodel:
    attributes:
      dtos/catalog/essential_input:
        name: "Nom"
        subtitle: "Sous-titre"
        content: "Contenu"
    errors:
      models:
        dtos/catalog/essential_input:
          attributes:
            name:
              taken: "est déjà pris par une autre fiche essentielle de ce cours"
            content:
              # ADR-0105 §4.4 : une fiche publiée ne reçoit pas d'emplacement d'image ; rien n'est écrit.
              image_slots_unreadable: "est trop complexe à relire : simplifiez la mise en forme (listes, blocs imbriqués), puis enregistrez de nouveau"
              image_slots_malformed: "contient un emplacement d'image mal écrit : « [[image: description]] » doit être seul dans son paragraphe, avec une description de 150 caractères au plus"
              image_slots_left: "contient un emplacement d'image à remplacer : insérez l'image ou retirez l'emplacement, la fiche est publiée"
              # ADR-0105 : une pièce jointe dont la signature ne se vérifie plus ; rien n'est écrit.
              invalid: "contient une image qui n'a pas pu être relue : rechargez la fiche, puis réessayez"
              # ADR-0105 : plus de 200 Ko de texte (menace.md, n° 13) ; rien n'est écrit.
              too_long: "dépasse 200 Ko de texte : scindez la fiche en deux, puis enregistrez de nouveau"
              # ADR-0105 : plus de 30 images citées par le texte (menace.md, n° 11) ; rien n'est rattaché.
              too_many_images: "cite plus de 30 images : retirez-en, ou scindez la fiche en deux, puis enregistrez de nouveau"
              # ADR-0105 : une image citée appartient à une autre fiche ou a été effacée ; rien n'est écrit.
              image_unavailable: "contient une image qui n'est plus disponible (copiée d'une autre fiche, ou effacée) : retirez-la ou renvoyez-la, puis enregistrez de nouveau"
  teams:
    essentials:
      form:
        name_placeholder: "Ex. : Brassage génétique par la méiose"
        name_hint: "150 caractères au plus, unique dans le cours. La casse saisie est gardée."
        subtitle_placeholder: "Ex. : Les deux divisions et leurs conséquences"
      new:
        title: "Nouvelle fiche essentielle"
        course: "Cours : %{name}"
        draft_notice: "La fiche essentielle naît en brouillon, visible uniquement par l'équipe, jusqu'à sa publication."
        submit: "Créer la fiche essentielle"
        cancel: "Annuler"
      edit:
        title: "Modifier la fiche essentielle"
        status: "Statut :"
        submit: "Enregistrer"
        cancel: "Annuler"
      create:
        created: "Fiche essentielle « %{name} » créée (brouillon)."
      update:
        updated: "Fiche essentielle « %{name} » modifiée."
      transition:
        published: "Fiche essentielle « %{name} » publiée."
        archived: "Fiche essentielle « %{name} » archivée."
        refused_title:
          publish: "Publication impossible"
          archive: "Archivage impossible"
        parent_not_published: "Le cours de cette fiche essentielle n'est pas publié : publiez d'abord le cours."
        transition_not_allowed: "Cette fiche essentielle est déjà dans cet état, ou ne peut pas prendre ce statut."
