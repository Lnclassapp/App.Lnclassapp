# examples:
#   periodic_cleanup:
#     class: CleanSoftDeletedRecordsJob
#     queue: background
#     args: [ 1000, { batch_size: 500 } ]
#     schedule: every hour
#   periodic_cleanup_with_command:
#     command: "SoftDeletedRecord.due.delete_all"
#     priority: 2
#     schedule: at 5am every day

production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
  # ADR-0047 : blobs uploaded then never attached are purged after 48 h.
  purge_unattached_blobs:
    class: Shared::PurgeUnattachedBlobsJob
    queue: default
    schedule: every day at 3am
  # ADR-0074 §4.4 : article images uploaded then never saved (modal closed) are deleted after 48 h, file purged.
  purge_orphan_article_images:
    class: Communication::PurgeOrphanArticleImagesJob
    queue: default
    schedule: every day at 3:30am
  # ADR-0105 §4.7 : question images uploaded then never saved are deleted after 48 h, file purged.
  purge_orphan_question_images:
    class: Assessment::PurgeOrphanQuestionImagesJob
    queue: default
    schedule: every day at 3:50am
  # ADR-0077 §4.5 : school staff accounts archived for 30 days are anonymized, their attachment deleted.
  purge_archived_staff:
    class: School::PurgeArchivedStaffJob
    queue: default
    schedule: every day at 4am
  # ADR-0080 : the IP of audit events older than 12 months is erased; the events stay.
  erase_audit_ips:
    class: Identity::EraseAuditIpsJob
    queue: default
    schedule: every day at 4:30am
  # ADR-0045, ADR-0078 : scheduled announcements are published within 5 minutes of their time.
  publish_scheduled_messages:
    class: Communication::PublishScheduledMessagesJob
    queue: default
    schedule: every 5 minutes
  # ADR-XXXX (modèles de langage), CA-25 : a generation left « pending » (killed worker, lost job) is closed after 2 minutes, its audio purged.
  fail_stale_crm_generations:
    class: Crm::FailStaleGenerationsJob
    queue: default
    schedule: every 15 minutes
  # notifications-push (ADR-0146 §3.2) : lit les six motifs, applique les fenêtres d'Abidjan
  # et le garde-fou anti-rafale, puis envoie. Un passage hors fenêtre ne fait rien.
  deliver_push_notifications:
    class: Communication::DeliverPushNotificationsJob
    queue: default
    schedule: every 15 minutes
  # ADR-0147 §4.3 (porteur, 2026-11-27) : la fenêtre de midi ouvre à 12 h 20, entre deux passages (:15 et :30) ;
  # ce passage de plus, du lundi au samedi, fait partir le premier envoi à l'ouverture, pas à 12 h 30.
  deliver_push_notifications_at_noon_opening:
    class: Communication::DeliverPushNotificationsJob
    queue: default
    schedule: "20 12 * * 1-6 Africa/Abidjan"
  # §4.1 : abonnements sans envoi réussi depuis 60 jours et envois de plus de 90 jours.
  purge_push_data:
    class: Communication::PurgePushDataJob
    queue: default
    schedule: every day at 5am
