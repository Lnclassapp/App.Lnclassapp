#     queue: background
#     args: [ 1000, { batch_size: 500 } ]
#     schedule: every hour
#   periodic_cleanup_with_command:
#     command: "SoftDeletedRecord.due.delete_all"
#     priority: 2
#     schedule: at 5am every day

production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
  # ADR-0047 : blobs uploaded then never attached are purged after 48 h.
  purge_unattached_blobs:
    class: Shared::PurgeUnattachedBlobsJob
    queue: default
    schedule: every day at 3am
  # ADR-0045, ADR-0078 : scheduled announcements are published within 5 minutes of their time.
  publish_scheduled_messages:
    class: Communication::PublishScheduledMessagesJob
    queue: default
    schedule: every 5 minutes
