production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
  # ADR-0047 : blobs uploaded then never attached are purged after 48 h.
  purge_unattached_blobs:
    class: Shared::PurgeUnattachedBlobsJob
    queue: default
    schedule: every day at 3am
  # ADR-0073 §4.4 : article images uploaded then never saved (modal closed) are deleted after 48 h, file purged.
  purge_orphan_article_images:
    class: Communication::PurgeOrphanArticleImagesJob
    queue: default
    schedule: every day at 3:30am
