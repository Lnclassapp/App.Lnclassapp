# Chantier hebergement-cloudflare (amendement Hostinger) : copie de la production Railway vers le VPS, projet Docker
# « lnclass-bascule », lancé à part du projet « lnclass ». Lecture seule sur Railway.
#   fichiers : objets du bucket Railway -> R2 (rejouable : ne recopie que ce qui manque ou diffère)
#   base     : une seule fois, pg_dump Railway (proxy TCP) -> Postgres du VPS, l'application arrêtée (APP_REPLICAS=0), puis
#              comptage des lignes de chaque table des deux côtés
# Les accès sont dans le .env du projet, envoyé par l'API sans être affiché.
name: lnclass-bascule

services:
  fichiers:
    image: rclone/rclone:1.71
    restart: "no"
    profiles: ["fichiers"]
    env_file:
      - path: .env
        required: false
    environment:
      RCLONE_CONFIG_SRC_TYPE: s3
      RCLONE_CONFIG_SRC_PROVIDER: Other
      RCLONE_CONFIG_SRC_FORCE_PATH_STYLE: "true"
      RCLONE_CONFIG_DST_TYPE: s3
      RCLONE_CONFIG_DST_PROVIDER: Cloudflare
      RCLONE_CONFIG_DST_REGION: auto
      RCLONE_CONFIG_DST_NO_CHECK_BUCKET: "true"
    entrypoint: ["sh", "-c"]
    command:
      - >-
        rclone copy "src:$${SOURCE_BUCKET_NAME}" "dst:$${BUCKET_NAME}" --size-only --transfers 8 --stats-one-line --stats 30s &&
        rclone check "src:$${SOURCE_BUCKET_NAME}" "dst:$${BUCKET_NAME}" --one-way --size-only &&
        echo "FICHIERS OK" || { echo "FICHIERS ECHEC"; exit 1; }

  base:
    image: postgres:18
    restart: "no"
    profiles: ["base"]
    env_file:
      - path: .env
        required: false
    networks: [lnclass]
    volumes:
      - lnclass_secrets:/secrets:ro
    configs:
      - source: copie_base
        target: /usr/local/bin/copie-base
    entrypoint: ["sh", "/usr/local/bin/copie-base"]

configs:
  copie_base:
    content: |
      #!/bin/sh
      set -eu
      trap 'st=$$?; rm -f /tmp/production.dump; [ "$$st" = 0 ] || echo "BASE ECHEC (voir les lignes au-dessus)"' EXIT
      [ "$${CONFIRMER_REMPLACEMENT:-}" = "base-du-vps" ] || { echo "CONFIRMER_REMPLACEMENT manquant : rien fait"; exit 1; }
      PGPASSWORD="$$(cat /secrets/db_password)"; [ -n "$$PGPASSWORD" ]; export PGPASSWORD
      new_psql() { psql -h db -U lnclass -d lnclass_production_new -v ON_ERROR_STOP=1 -tA "$$@"; }
      admin_psql() { psql -h db -U lnclass -d postgres -v ON_ERROR_STOP=1 -tA "$$@"; }
      source_psql() { psql "$$SOURCE_DATABASE_URL" -v ON_ERROR_STOP=1 -tA "$$@"; }
      list="SELECT tablename FROM pg_tables WHERE schemaname = 'public' ORDER BY 1"
      # One copy only: once it ran, the VPS base is the production and a new copy would overwrite it.
      old=$$(admin_psql -c "SELECT count(*) FROM pg_database WHERE datname = 'lnclass_production_old'")
      [ "$$old" = "0" ] || { echo "BASE ECHEC : une copie a déjà été faite (lnclass_production_old existe), rien fait"; exit 1; }
      busy=$$(admin_psql -c "SELECT count(*) FROM pg_stat_activity WHERE datname = 'lnclass_production'")
      [ "$$busy" = "0" ] || { echo "BASE ECHEC : $$busy connexions ouvertes sur la base du VPS, arrêter l'application d'abord"; exit 1; }
      tables=$$(source_psql -c "$$list")
      [ -n "$$tables" ] || { echo "BASE ECHEC : aucune table lue dans la source"; exit 1; }
      umask 077
      pg_dump "$$SOURCE_DATABASE_URL" --format=custom --no-owner --no-acl --file /tmp/production.dump
      # Restored beside the live base, compared, and only then renamed into place: a failed copy leaves the VPS base
      # as it was, never empty (an empty base would be re-created and seeded by db:prepare at the next start).
      admin_psql -c "DROP DATABASE IF EXISTS lnclass_production_new"
      admin_psql -c "CREATE DATABASE lnclass_production_new OWNER lnclass"
      pg_restore -h db -U lnclass -d lnclass_production_new --no-owner --no-acl --single-transaction --exit-on-error /tmp/production.dump
      rm -f /tmp/production.dump
      [ "$$tables" = "$$(new_psql -c "$$list")" ] || { echo "BASE ECHEC : les listes de tables diffèrent, base du VPS inchangée"; exit 1; }
      ecarts=0
      for t in $$tables; do
        s=$$(source_psql -c "SELECT count(*) FROM public.\"$$t\"")
        c=$$(new_psql -c "SELECT count(*) FROM public.\"$$t\"")
        [ "$$s" = "$$c" ] || { echo "ECART $$t : source $$s, cible $$c"; ecarts=$$((ecarts + 1)); }
      done
      [ "$$ecarts" = "0" ] || { echo "BASE ECHEC : $$ecarts tables en écart, base du VPS inchangée"; exit 1; }
      admin_psql -c "DROP DATABASE IF EXISTS lnclass_production_old"
      admin_psql -c "ALTER DATABASE lnclass_production RENAME TO lnclass_production_old"
      admin_psql -c "ALTER DATABASE lnclass_production_new RENAME TO lnclass_production"
      echo "BASE OK ($$(echo "$$tables" | wc -l) tables ; l'ancienne base est gardée sous lnclass_production_old)"

networks:
  lnclass:
    external: true
    name: lnclass_default

volumes:
  lnclass_secrets:
    external: true
    name: lnclass_secrets
